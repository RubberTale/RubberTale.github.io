<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>世界历史时空地图</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.0.21/leaflet-maplibre-gl.js"></script>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7;
    --panel: #fcfcfb;
    --panel-2: #f2f1ec;
    --ink: #0b0b0b;
    --ink-2: #52514e;
    --muted: #898781;
    --hair: #e1e0d9;
    --hair-2: #c3c2b7;
    --border: rgba(11,11,11,0.10);
    --accent: #2a78d6;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d;
    --panel: #1a1a19;
    --panel-2: #242421;
    --ink: #ffffff;
    --ink-2: #c3c2b7;
    --muted: #898781;
    --hair: #2c2c2a;
    --hair-2: #383835;
    --border: rgba(255,255,255,0.10);
    --accent: #5ba3e8;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--page);
    color: var(--ink);
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 16px;
    padding: 10px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    z-index: 500;
    flex-wrap: wrap;
  }
  header h1 { font-size: 17px; margin: 0; letter-spacing: .02em; }
  header .sub { color: var(--ink-2); font-size: 12.5px; }
  .spacer { flex: 1; }
  .btn {
    appearance: none; border: 1px solid var(--hair-2); background: var(--panel);
    color: var(--ink); border-radius: 8px; padding: 6px 12px; cursor: pointer;
    font-size: 13px; font-family: inherit;
  }
  .btn:hover { background: var(--panel-2); }
  #themeToggle { white-space: nowrap; }
  .layout { flex: 1; display: flex; min-height: 0; }
  aside {
    width: 360px; max-width: 42%; min-width: 260px;
    display: flex; flex-direction: column;
    border-right: 1px solid var(--border); background: var(--panel);
  }
  .now-bar {
    padding: 10px 14px; border-bottom: 1px solid var(--hair);
    display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center;
  }
  .nb-year { font-weight: 700; font-size: 15px; }
  .nb-col { font-size: 12.5px; color: var(--ink-2); }
  .nb-col b {
    display: inline-block; margin-right: 6px; font-weight: 700; font-size: 11px;
    padding: 1px 6px; border-radius: 4px; color: #fff;
  }
  .nb-west b { background: #e34948; }
  .nb-east b { background: #2a78d6; }
  .nb-meet b { background: #e0a418; color: #5a3d00; }
  .toolbar {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    padding: 8px 14px 10px;
  }
  .toolbar .btn { flex: 1; }
  .topic-bar {
    display: flex; flex-wrap: wrap; gap: 4px; align-items: center;
    padding: 0 14px 8px;
  }
  .topic-label { font-size: 11px; color: var(--muted); margin-right: 2px; white-space: nowrap; }
  .topic-chip {
    appearance: none; border: 1px solid var(--hair-2); background: var(--panel);
    color: var(--ink-2); border-radius: 20px; padding: 2px 9px; cursor: pointer;
    font-size: 11px; font-family: inherit; white-space: nowrap;
  }
  .topic-chip:hover { border-color: var(--accent); color: var(--ink); }
  .topic-chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .search-bar {
    display: flex; align-items: center; gap: 6px;
    padding: 8px 14px 6px; position: relative;
  }
  .search-input {
    flex: 1; appearance: none; border: 1px solid var(--hair-2); background: var(--panel-2);
    color: var(--ink); border-radius: 8px; padding: 6px 9px; font-size: 13px;
    font-family: inherit; outline: none;
  }
  .search-input:focus { border-color: var(--accent); }
  .search-input::placeholder { color: var(--muted); }
  .search-clear {
    appearance: none; border: none; background: none; color: var(--muted);
    font-size: 15px; cursor: pointer; padding: 2px; line-height: 1; flex-shrink: 0;
  }
  .search-clear:hover { color: var(--ink); }
  .search-hint { color: var(--muted); font-size: 11px; padding: 0 14px 6px; }
  .search-results { border-top: 1px solid var(--hair); }
  #countText { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .event-list { flex: 1; overflow-y: auto; border-top: 1px solid var(--hair); }
  .ev-item {
    display: flex; align-items: center; gap: 10px; width: 100%;
    padding: 7px 14px; border: none; background: none; cursor: pointer;
    font-size: 13px; color: var(--ink); font-family: inherit; text-align: left;
  }
  .ev-item:hover { background: var(--panel-2); }
  .ev-item.selected { background: color-mix(in srgb, var(--accent) 14%, transparent); }
  .cat-badge {
    width: 17px; height: 17px; border-radius: 4px; flex-shrink: 0;
    display: inline-flex; align-items: center; justify-content: center;
    color: #fff; font-size: 10px; font-weight: 700;
    box-shadow: 0 1px 2px rgba(0,0,0,.25);
  }
  .dot {
    width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
    box-shadow: 0 0 0 1.5px rgba(0,0,0,.2);
  }
  .ev-year { color: var(--muted); font-size: 11.5px; flex-shrink: 0; width: 92px; font-variant-numeric: tabular-nums; }
  .ev-title { font-weight: 600; }
  .ev-imp { margin-left: auto; color: var(--muted); font-size: 11px; flex-shrink: 0; }
  .empty { padding: 14px; color: var(--muted); font-size: 13px; }
  main { flex: 1; position: relative; min-width: 0; }
  #map { position: absolute; inset: 0; }
  .legend {
    position: absolute; left: 12px; top: 12px; z-index: 400;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 12px; font-size: 12px;
    box-shadow: 0 2px 10px rgba(0,0,0,.12);
  }
  .legend h4 { margin: 0 0 6px; font-size: 11.5px; color: var(--ink-2); font-weight: 600; letter-spacing: .04em; }
  .legend ul { list-style: none; margin: 0; padding: 0; }
  .legend li { display: flex; align-items: center; gap: 6px; color: var(--ink-2); margin: 3px 0; }
  .lg {
    width: 17px; height: 17px; border-radius: 4px; flex-shrink: 0;
    display: inline-flex; align-items: center; justify-content: center;
    color: #fff; font-size: 10px; font-weight: 700;
    box-shadow: 0 0 0 1px rgba(0,0,0,.25);
  }
  .timeline {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 400;
    background: var(--panel); border-top: 1px solid var(--border);
    padding: 10px 16px 10px;
    box-shadow: 0 -2px 10px rgba(0,0,0,.08);
  }
  .timeline-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 5px; gap: 10px; }
  #yearLabel { font-weight: 700; font-size: 14px; white-space: nowrap; }
  .tl-btn {
    appearance: none; border: 1px solid var(--hair-2); background: var(--panel-2);
    color: var(--ink); border-radius: 7px; padding: 3px 10px; cursor: pointer;
    font-size: 12px; font-family: inherit; white-space: nowrap;
  }
  .tl-btn:hover { background: var(--hair); }
  .tl-btn:disabled { opacity: .4; cursor: default; }
  .timeline input[type="range"] { width: 100%; margin: 0; accent-color: var(--accent); cursor: pointer; }
  .timeline-scale {
    display: flex; justify-content: space-between; color: var(--muted);
    font-size: 11px; margin-top: 2px;
  }
  .popup-title { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .popup-tag {
    font-size: 11px; font-weight: 600; color: #fff; border-radius: 5px;
    padding: 1px 7px;
  }
  .popup-region { color: var(--muted); font-size: 12px; margin-top: 1px; }
  .popup-note { font-size: 12.5px; line-height: 1.55; color: var(--ink-2); margin: 8px 0; }
  .popup-links { display: flex; gap: 14px; border-top: 1px solid var(--hair); padding-top: 7px; }
  .popup-links a { font-size: 12px; color: var(--accent); text-decoration: none; }
  .popup-links a:hover { text-decoration: underline; }
  .leaflet-container { font-family: inherit; background: #dbe3e6; }
  .leaflet-popup-content-wrapper { border-radius: 10px; }
  :root[data-theme="dark"] .leaflet-popup-content-wrapper,
  :root[data-theme="dark"] .leaflet-popup-tip { background: #1a1a19; color: #fff; }
  :root[data-theme="dark"] .leaflet-popup-content-wrapper a { color: #5ba3e8; }
  .pin {
    --c: #3b82f6;
    width: 22px; height: 22px; border-radius: 50%;
    background-color: var(--c);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 11.5px; font-weight: 700; line-height: 1;
    box-shadow: 0 0 0 1.5px rgba(255,255,255,.9), 0 2px 4px rgba(0,0,0,.35);
    transition: transform .12s ease;
  }
  .pin:hover { transform: scale(1.2); z-index: 1000 !important; }
  .pin.selected {
    box-shadow: 0 0 0 2px #fff, 0 0 0 4.5px var(--c), 0 2px 8px rgba(0,0,0,.5);
    transform: scale(1.25);
  }
  .event-label {
    font-size: 11px; font-weight: 700; color: var(--ink);
    background: rgba(255,255,255,.88); border: 1px solid var(--hair-2);
    border-radius: 4px; padding: 1px 6px; white-space: nowrap; pointer-events: none;
    box-shadow: 0 1px 3px rgba(0,0,0,.2); line-height: 1.2;
  }
  :root[data-theme="dark"] .event-label {
    background: rgba(25,25,24,.88); color: #fff; border-color: rgba(255,255,255,.2);
  }
  .toolbar #routeBtn, .toolbar #prehistoryBtn, .toolbar #territoryBtn, .toolbar #landmarkBtn { flex: 0 0 auto; font-size: 12px; padding: 7px 10px; }
  .terr-sq {
    width: 16px; height: 16px; border-radius: 4px; flex-shrink: 0;
    box-shadow: 0 0 0 1px rgba(0,0,0,.3);
  }
  .pin-node {
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 4px; color: #fff; font-weight: 700; font-size: 11px;
    box-shadow: 0 1px 3px rgba(0,0,0,.35), 0 0 0 1.5px #fff;
    cursor: pointer; transition: transform .15s;
  }
  .pin-node:hover { transform: scale(1.15); z-index: 1000 !important; }
  .pin-pass { border-radius: 50% 50% 2px 2px; }
  .node-label {
    font-size: 11.5px; font-weight: 700; color: var(--ink);
    text-shadow: 0 1px 2px rgba(255,255,255,.9), 0 0 3px rgba(255,255,255,.9);
    white-space: nowrap; pointer-events: none;
  }
  :root[data-theme="dark"] .node-label {
    text-shadow: 0 1px 2px rgba(0,0,0,.9), 0 0 3px rgba(0,0,0,.9);
  }
  .wp-label {
    text-align: center; font-size: 11px; font-weight: 600; color: var(--ink);
    line-height: 1.2; text-shadow: 0 1px 2px rgba(255,255,255,.8);
  }
  .wp-date { font-size: 10px; color: var(--muted); font-weight: 500; }
  .route-arrow {
    display: block; width: 14px; height: 14px;
    font-size: 13px; line-height: 1; text-align: center;
    text-shadow: 0 0 2px rgba(255,255,255,.85), 0 0 2px rgba(255,255,255,.85);
  }
  :root[data-theme="dark"] .wp-label { text-shadow: 0 1px 2px rgba(0,0,0,.85); }
  .terr-label {
    font-size: 14px; font-weight: 700; color: var(--c, var(--ink));
    text-shadow: 0 1px 2px rgba(255,255,255,.9), 0 0 3px rgba(255,255,255,.9);
    background: rgba(255,255,255,.55); border: 1px solid var(--c, var(--ink));
    border-radius: 6px; padding: 1px 8px; line-height: 1.3; text-align: center;
    white-space: nowrap;
  }
  :root[data-theme="dark"] .terr-label { text-shadow: 0 1px 3px rgba(0,0,0,.9); background: rgba(0,0,0,.45); }
  .rt-list { border-top: 1px solid var(--hair); margin-top: 8px; padding-top: 6px; }
  .rt-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); padding: 2px 0; }
  .rt-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  @media (max-width: 820px) {
    .layout { flex-direction: column; }
    aside { width: 100%; max-width: none; min-width: 0; border-right: none; border-bottom: 1px solid var(--border); max-height: 46%; }
    main { min-height: 54%; }
    .legend { display: none; }
  .view-mode-selector { display: flex; gap: 4px; background: var(--panel-2); padding: 2px; border-radius: 6px; border: 1px solid var(--hair-2); }
  .mode-btn {
    appearance: none; border: none; background: transparent; color: var(--ink-2);
    font-size: 11.5px; padding: 3px 8px; border-radius: 4px; cursor: pointer; font-family: inherit;
  }
  .mode-btn.active { background: var(--accent); color: #fff; font-weight: 600; }
  .century-select {
    appearance: none; border: 1px solid var(--hair-2); background: var(--panel); color: var(--ink);
    border-radius: 6px; padding: 3px 24px 3px 8px; font-size: 12px; font-family: inherit; cursor: pointer;
    background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
    background-repeat: no-repeat; background-position: right 6px center; background-size: 12px;
  }
  :root[data-theme="dark"] .leaflet-tile-pane {
    filter: invert(100%) hue-rotate(180deg) brightness(85%) contrast(110%);
  }
</style>
</head>
<body>
<header>
  <h1>世界历史时空地图</h1>
  <span class="sub">同一时刻，世界各地正在发生什么</span>
  <span class="sub" style="font-size: 11.5px; opacity: 0.8;">| 更新: <span id="lastUpdate">2026-09-02 14:00:03 (CST)</span></span>
  <div class="spacer"></div>
  <a id="ohmLink" class="btn" href="https://www.openhistoricalmap.org/" target="_blank" rel="noopener" title="在 OpenHistoricalMap 维基历史地图中全景查看当前年代全球历史细节" style="text-decoration:none;">🌐 探索 OHM 维基全景 ↗</a>
  <button id="basemapBtn" class="btn" type="button" title="切换底图：自然山川地形 / OpenHistoricalMap 维基时空矢量底图">底图: 自然地形</button>
  <button id="themeToggle" class="btn" type="button" aria-label="切换明暗主题">🌙 深色模式</button>
</header>
<div class="layout">
  <aside>
    <div id="nowBar" class="now-bar"></div>
    <div class="toolbar">
      <button id="routeBtn" class="btn" type="button" title="历史行进路线：点击切换 自动/显示/隐藏">线路 · 自动</button>
      <button id="prehistoryBtn" class="btn" type="button" title="史前人类遗址：固定标注，不随时间轴变化">史前遗址 · 显示</button>
      <button id="territoryBtn" class="btn" type="button" title="世界历史疆域：随时间轴显示各时代帝国与政权版图（示意）">疆域 · 显示</button>
      <button id="landmarkBtn" class="btn" type="button" title="古都要塞与工程：显示历史古都、关隘与长城/运河等重大工程">古都关隘 · 显示</button>
    </div>
    <div class="search-bar">
      <input id="searchInput" class="search-input" type="text" placeholder="🔍 搜索事件：输入标题 / 地点 / 时代 / 人名 …" autocomplete="off">
      <button id="searchClear" class="search-clear" type="button" title="清空搜索" style="display:none">✕</button>
    </div>
    <div id="searchHint" class="search-hint" style="display:none"></div>
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 14px 6px;">
      <div style="display: flex; align-items: center; gap: 8px;">
        <span class="topic-label">专题</span>
        <button id="tagTimelessMode" type="button" class="topic-chip" title="标签优先模式：点击后标签过滤将显示所有时间的事件，忽略时间轴限制">标签优先</button>
      </div>
      <div id="tagModeStatus" style="font-size: 12px; color: var(--muted);">
        当前模式：标签+时间过滤
      </div>
    </div>
    <div id="topicBar" class="topic-bar" title="专题过滤：可多选（并集），不选则显示全部事件"></div>
    <div id="countText" style="padding:0 14px 6px;"></div>
    <div id="eventList" class="event-list"></div>
  </aside>
  <main>
    <div id="map"></div>
    <div class="legend">
      <h4>图例</h4>
      <ul>
        <li><span class="lg" style="background:#ef4444">战</span>战争军事</li>
        <li><span class="lg" style="background:#3b82f6">政</span>政治王朝</li>
        <li><span class="lg" style="background:#10b981">创</span>科技发明</li>
        <li><span class="lg" style="background:#f97316">文</span>思想文化</li>
        <li><span class="lg" style="background:#8b5cf6">宗</span>宗教信仰</li>
        <li><span class="lg" style="background:#06b6d4">航</span>航海交流</li>
        <li><span class="lg" style="background:#f59e0b">人</span>历史人物</li>
        <li><span class="lg" style="background:#ec4899">星</span>影星艺术</li>
        <li><span class="lg" style="background:#8d6e63">遗</span>史前人类遗址</li>
        <li><span class="pin-node" style="background:#2563eb;width:15px;height:15px;font-size:9.5px;vertical-align:middle;margin-right:4px;">都</span>历史古都名城</li>
        <li><span class="pin-node pin-pass" style="background:#dc2626;width:15px;height:15px;font-size:9.5px;vertical-align:middle;margin-right:4px;">关</span>军事要塞关隘</li>
        <li><span class="terr-sq" style="background:#c2410c"></span>东方历代版图</li>
        <li><span class="terr-sq" style="background:#991b1b"></span>西方世界帝国</li>
      </ul>
    </div>
    <div class="timeline">
      <div class="timeline-top">
        <div class="view-mode-selector">
          <button id="modeAllBtn" class="mode-btn active" type="button">全部历史 (全览)</button>
          <button id="modeCenturyBtn" class="mode-btn" type="button">百年视图 (精细)</button>
          <button id="modeYearBtn" class="mode-btn" type="button">年度视图 (按月)</button>
        </div>
        <select id="centurySelect" class="century-select" style="display:none"></select>
        <select id="yearSelect" class="century-select" style="display:none"></select>
        <div class="spacer"></div>
        <button id="prevBtn2" class="tl-btn" type="button" title="上一节点：跳转到前一个历史事件">◀</button>
        <span id="yearLabel"></span>
        <button id="nextBtn2" class="tl-btn" type="button" title="下一节点：跳转到后一个历史事件">▶</button>
      </div>
      <input id="yearSlider" type="range" min="0" max="3119" step="1" value="1055">
      <div class="timeline-scale">
        <span id="minLabel"></span>
        <span id="scaleCenterText">前1046 牧野 ↔ 前221 秦统一 ↔ 476 西罗马灭亡 ↔ 1911 辛亥 ↔ 1934 长征 ↔ 1945 胜利</span>
        <span id="maxLabel"></span>
      </div>
    </div>
  </main>
</div>

<script>
'use strict';
const YEAR_WINDOW = 15;     // 1934 年前的可见窗口（单位：年）
const MONTH_WINDOW = 24;    // 1934 年起按月的可见窗口（单位：月，约 2 年）
const MONTH_MODE_YEAR = 1934; // 自此年份起，时间颗粒度切换为月份
let MIN_YEAR = -1046;
let MAX_YEAR = 1945;
let YEAR_UNITS = MONTH_MODE_YEAR - MIN_YEAR;

let events = [];
let routes = [];
let territories = [];
let map = null;
let eventLayer = null;
let routeLayer = null;
let routeLabels = [];
let terrLayer = null;
let terrLabels = [];
let territoryVisible = true;
let landmarks = { nodes: [], engineering: [] };
let landmarkLayer = null;
let landmarkLabels = [];
let landmarkVisible = true;
const LANDMARK_LABEL_MIN_ZOOM = 4;
let basemapMode = 'terrain'; // 'terrain' | 'ohm'
let ohmLayer = null;
const TOPICS = ['AI', '罗马', '战争', '科技', '政治', '宗教', '中外交流', '人物', '影星'];
const activeTopics = new Set();
let tagIgnoreTimeMode = false; // 新增：标签模式是否忽略时间限制
const eventMarkers = {};
let cur = { y: 9, m: 1 };
let selectedId = null;
let theme = 'light';
let routeForced = null; // null=自动(随滑块) / true=强制显示 / false=强制隐藏
const LABEL_MIN_ZOOM = 5; // 路线站点标签在低于此缩放时隐藏，避免重叠

function updateURLState() {
  if (!map) return;
  const params = new URLSearchParams(window.location.search);
  params.set('year', cur.y);
  if (cur.m > 1) params.set('month', cur.m); else params.delete('month');
  if (timeMode !== 'all') params.set('mode', timeMode); else params.delete('mode');

  const center = map.getCenter();
  params.set('lat', center.lat.toFixed(2));
  params.set('lng', center.lng.toFixed(2));
  params.set('zoom', map.getZoom());

  if (selectedId) {
    params.set('event', selectedId);
  } else {
    params.delete('event');
  }
  const newSearch = '?' + params.toString();
  if (window.location.search !== newSearch) {
    window.history.replaceState(null, '', window.location.pathname + newSearch);
  }

  const ohmLink = document.getElementById('ohmLink');
  if (ohmLink && map) {
    const c = map.getCenter();
    const z = map.getZoom();
    const dateStr = (cur.y > 0 ? String(cur.y).padStart(4, '0') : cur.y) + '-' + String(cur.m || 1).padStart(2, '0') + '-01';
    ohmLink.href = `https://www.openhistoricalmap.org/#map=${z}/${c.lat.toFixed(4)}/${c.lng.toFixed(4)}&date=${dateStr}`;
  }
}

function loadURLState() {
  const params = new URLSearchParams(window.location.search);
  const mMode = params.get('mode');
  if (mMode === 'century' || mMode === 'year' || mMode === 'all') {
    timeMode = mMode;
  }
  const yStr = params.get('year');
  if (yStr !== null) {
    const y = parseInt(yStr, 10);
    const m = parseInt(params.get('month') || '1', 10);
    if (!isNaN(y)) cur = { y, m };
  }
  const lat = parseFloat(params.get('lat'));
  const lng = parseFloat(params.get('lng'));
  const zoom = parseInt(params.get('zoom'), 10);
  let mapSet = false;
  if (!isNaN(lat) && !isNaN(lng) && !isNaN(zoom)) {
    map.setView([lat, lng], zoom);
    mapSet = true;
  }
  const evt = params.get('event');
  if (evt) {
    selectedId = evt;
  }
  return { mapSet, selectedEventId: evt };
}

function getEventCategory(e) {
  if (!e) return EVENT_CATEGORIES.pol;
  const tags = e.tags || [];
  const title = e.title || '';
  
  if (tags.includes('影星')) return EVENT_CATEGORIES.star;
  
  const warKws = ['战争', '军事', '农民起义'];
  if (warKws.some(t => tags.includes(t)) || ['之战', '之役', '战役', '起义', '决战', '兵变', '远征', '大战', '会战', '长征', '大捷', '战国', '兵', '围城'].some(k => title.includes(k))) {
    return EVENT_CATEGORIES.war;
  }
  
  const techKws = ['科技', '科学', '物理学', '天文学', '数学', 'AI'];
  if (techKws.some(t => tags.includes(t)) || ['发明', '发现', '工业革命', '计算机', '登月', '相对论', '万有引力', '造纸', '印刷', '望远镜'].some(k => title.includes(k))) {
    return EVENT_CATEGORIES.tech;
  }
  
  const relKws = ['宗教', '佛教'];
  if (relKws.some(t => tags.includes(t)) || ['佛教', '基督', '伊斯兰', '宗教', '教皇', '寺', '圣经', '宗教改革', '神学'].some(k => title.includes(k))) {
    return EVENT_CATEGORIES.rel;
  }
  
  const tradeKws = ['航海', '中外交流', '文化交流', '外交', '殖民', '商业', '金融'];
  if (tradeKws.some(t => tags.includes(t)) || ['出使', '下西洋', '西行', '环球航行', '丝绸之路', '通商', '东传', '探险'].some(k => title.includes(k))) {
    return EVENT_CATEGORIES.trade;
  }
  
  if (tags.includes('人物') || tags.includes('民族英雄') || ['诞生', '逝世', '出生', '遇刺', '逝'].some(k => title.includes(k))) {
    return EVENT_CATEGORIES.person;
  }
  
  const cultKws = ['文化', '思想', '哲学', '文学', '艺术', '出版', '历史', '文明', '神话'];
  if (cultKws.some(t => tags.includes(t)) || ['文艺复兴', '百家争鸣', '启蒙运动', '序', '集', '赋', '诗', '书', '红楼梦', '九章算术', '离骚'].some(k => title.includes(k))) {
    return EVENT_CATEGORIES.cult;
  }
  
  const polKws = ['政治', '统一', '朝代更替', '革命', '帝国', '盛世', '改革', '法律', '民族'];
  if (polKws.some(t => tags.includes(t)) || ['统一', '称帝', '建国', '立国', '变法', '革命', '宪章', '宣言', '改革', '王朝', '亡', '灭', '分治', '新政'].some(k => title.includes(k))) {

}

function eventCatColor(cat) {
  return theme === 'dark' ? cat.darkColor : cat.color;
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtTime(y, m) {
  return (y < 0 ? `前 ${-y}` : `公元 ${y}`) + ' 年' + (m > 1 ? ' ' + m + ' 月' : '');
}
function fmtYear(y) { return fmtTime(y, 1); }
function tOfEvent(e) { return { y: e.year, m: e.month || 1 }; }
function tOfEventEnd(e) {
  if (e.year_end == null) return null;
  return { y: e.year_end, m: e.month_end || 12 };
}
function fmtRange(e) {
  const end = tOfEventEnd(e);
  if (!end) return fmtTime(e.year, e.month || 1);
  const sy = e.year, ey = end.y;
  if (!e.month_end) {
    if (sy < 0 && ey < 0) return `前 ${-sy}—${-ey} 年`;
    if (sy < 0) return `前 ${-sy} 年—公元 ${ey} 年`;
    return `公元 ${sy}—${ey} 年`;
  }
  return `${fmtTime(sy, e.month || 1)} — ${fmtTime(ey, end.m)}`;
}
function absOf(t) { return t.y * 12 + (t.m - 1); }

let timeMode = 'all'; // 'all' 全览模式 / 'century' 百年精细视图 / 'year' 年度精细视图(按月)
let activeCentury = 1000; // 选中的百年开始年份，例如 1000 表示 1000-1099 年 (11世纪)
let activeYear = 2024;    // 选中的年度年份，例如 2024 表示 2024 年 1~12 月

function centuryLabel(startYear) {
  const endYear = startYear + 99;
  let name = '';
  if (startYear < 0) {
    const c = Math.ceil(Math.abs(startYear) / 100);
    name = `前 ${c} 世纪 (${startYear}—${endYear})`;
  } else {
    const c = Math.floor(startYear / 100) + 1;
    name = `公元 ${c} 世纪 (${startYear}—${endYear})`;
  }
  return name;
}

function buildCenturyOptions() {
  const select = document.getElementById('centurySelect');
  if (!select) return;
  select.innerHTML = '';
  
  // 生成从 MIN_YEAR 到 MAX_YEAR 涵盖的所有百年整百数
  const startC = Math.floor(MIN_YEAR / 100) * 100;
  const endC = Math.floor(MAX_YEAR / 100) * 100;
  
  for (let y = startC; y <= endC; y += 100) {
    const opt = document.createElement('option');
    opt.value = y;
    opt.textContent = centuryLabel(y);
    select.appendChild(opt);
  }
  select.value = activeCentury;
}

function buildYearOptions() {
  const select = document.getElementById('yearSelect');
  if (!select) return;
  select.innerHTML = '';

  // 统计各年份事件数
  const yearCounts = {};
  for (const e of events) {
    yearCounts[e.year] = (yearCounts[e.year] || 0) + 1;
  }

  // 1. 🌟 近40年现代故事 (1980 — 2026)
  const recentGroup = document.createElement('optgroup');
  recentGroup.label = '🌟 近40年现代故事 (1980—2026)';
  for (let y = 2026; y >= 1980; y--) {
    const opt = document.createElement('option');
    opt.value = y;
    const cnt = yearCounts[y] || 0;
    opt.textContent = `公元 ${y} 年${cnt > 0 ? ` (${cnt}个事件)` : ''}`;
    recentGroup.appendChild(opt);
  }
  select.appendChild(recentGroup);

  // 2. 📜 历史其他重要年份节点
  const histYears = Object.keys(yearCounts)
    .map(Number)
    .filter(y => y < 1980 || y > 2026)
    .sort((a, b) => b - a);

  if (histYears.length > 0) {
    const histGroup = document.createElement('optgroup');
    histGroup.label = '📜 历史其他重要年份节点';
    for (const y of histYears) {
      const opt = document.createElement('option');
      opt.value = y;
      const cnt = yearCounts[y] || 0;
      opt.textContent = `${fmtYear(y)} (${cnt}个事件)`;
      histGroup.appendChild(opt);
    }
    select.appendChild(histGroup);
  }
  select.value = activeYear;
}

function updateSliderBounds() {
  const slider = document.getElementById('yearSlider');
  if (!slider) return;
  
  if (timeMode === 'year') {
    // 年度精细视图模式：滑块范围 1 ~ 12 月
    slider.min = 1;
    slider.max = 12;
    slider.step = 1;
    
    document.getElementById('minLabel').textContent = `${activeYear > 0 ? activeYear : '前' + (-activeYear)}年 1月`;
    document.getElementById('maxLabel').textContent = `${activeYear > 0 ? activeYear : '前' + (-activeYear)}年 12月`;
    document.getElementById('scaleCenterText').textContent = `年度精细范围：${fmtYear(activeYear)} (1月 — 12月)`;
    
    if (cur.y !== activeYear) {
      cur = { y: activeYear, m: 1 };
    }
    slider.value = cur.m || 1;
  } else if (timeMode === 'century') {
    // 百年精细视图模式：slider 表示 0 ~ 99 年（如果区间包含 1934 年之后按月展开）
    const startY = activeCentury;
    const endY = activeCentury + 99;
    
    // 如果当前选中的百年跨越了 1934 年（例如 1900-1999），需计算精准的 slider max
    if (endY < MONTH_MODE_YEAR) {
      slider.min = 0;
      slider.max = 99;
    } else if (startY >= MONTH_MODE_YEAR) {
      const totalMonths = (endY - startY + 1) * 12 - 1;
      slider.min = 0;
      slider.max = totalMonths;
    } else {
      // 跨越 1934 的百年（1900 - 1999）
      const normalYears = MONTH_MODE_YEAR - startY; // 1900-1933 共 34 年
      const monthYears = endY - MONTH_MODE_YEAR + 1; // 1934-1999 共 66 年
      slider.min = 0;
      slider.max = normalYears + monthYears * 12 - 1;
    }
    
    document.getElementById('minLabel').textContent = fmtTime(startY, 1);
    document.getElementById('maxLabel').textContent = fmtTime(endY, 12);
    document.getElementById('scaleCenterText').textContent = `精细范围：${centuryLabel(activeCentury)}`;
    
    // 确保 cur 在当前百年范围内
    if (cur.y < startY || cur.y > endY) {
      cur = { y: startY, m: 1 };
    }
    slider.value = timeToSlider(cur);
  } else {
    // 全览模式
    slider.min = 0;
    slider.max = timeToSlider(tOfEvent(events.reduce((a, b) => absOf(tOfEvent(b)) > absOf(tOfEvent(a)) ? b : a)));
    document.getElementById('minLabel').textContent = fmtTime(MIN_YEAR, 1);
    const maxT = sliderToTime(slider.max);
    document.getElementById('maxLabel').textContent = fmtTime(maxT.y, maxT.m);
    document.getElementById('scaleCenterText').textContent = `前1046 牧野 ↔ 前221 秦统一 ↔ 476 西罗马灭亡 ↔ 1911 辛亥 ↔ 1934 长征 ↔ 1945 胜利`;
    slider.value = timeToSlider(cur);
  }
}

function sliderToTime(v) {
  if (timeMode === 'year') {
    return { y: activeYear, m: Math.max(1, Math.min(12, parseInt(v, 10))) };
  }
  if (timeMode === 'century') {
    const startY = activeCentury;
    const endY = activeCentury + 99;
    if (endY < MONTH_MODE_YEAR) {
      return { y: startY + v, m: 1 };
    } else if (startY >= MONTH_MODE_YEAR) {
      return { y: startY + Math.floor(v / 12), m: (v % 12) + 1 };
    } else {
      const normalYears = MONTH_MODE_YEAR - startY;
      if (v < normalYears) return { y: startY + v, m: 1 };
      const k = v - normalYears;
      return { y: MONTH_MODE_YEAR + Math.floor(k / 12), m: (k % 12) + 1 };
    }
  }
  
  if (v < YEAR_UNITS) return { y: MIN_YEAR + v, m: 1 };
  const k = v - YEAR_UNITS;
  return { y: MONTH_MODE_YEAR + Math.floor(k / 12), m: (k % 12) + 1 };
}

function timeToSlider(t) {
  if (timeMode === 'year') {
    return t.m || 1;
  }
  if (timeMode === 'century') {
    const startY = activeCentury;
    const endY = activeCentury + 99;
    if (endY < MONTH_MODE_YEAR) {
      return Math.max(0, Math.min(99, t.y - startY));
    } else if (startY >= MONTH_MODE_YEAR) {
      return Math.max(0, (t.y - startY) * 12 + (t.m - 1));
    } else {
      if (t.y < MONTH_MODE_YEAR) return Math.max(0, t.y - startY);
      const normalYears = MONTH_MODE_YEAR - startY;
      return normalYears + (t.y - MONTH_MODE_YEAR) * 12 + (t.m - 1);
    }
  }
  
  if (t.y < MONTH_MODE_YEAR) return t.y - MIN_YEAR;
  return YEAR_UNITS + (t.y - MONTH_MODE_YEAR) * 12 + (t.m - 1);
}
function inWindow(e, t) {
  const et = tOfEvent(e);
  const end = tOfEventEnd(e);
  
  if (timeMode === 'year') {
    // 年度视图下：展示属于该年度的所有事件（包含持续跨越该年的事件）
    const inYear = end ? (et.y <= activeYear && end.y >= activeYear) : (et.y === activeYear);
    return inYear;
  }

  if (timeMode === 'century') {
    const startY = activeCentury;
    const endY = activeCentury + 99;
    // 百年精细视图下：事件本身必须落在该百年内（或者持续事件跨越该百年）
    const inCentury = end ? (et.y <= endY && end.y >= startY) : (et.y >= startY && et.y <= endY);
    if (!inCentury) return false;
  }

  if (end) {
    // 持续事件：滑块滑入 [起,止] 区间内即显示；不做 ±窗口外扩，避免长期事件常驻刷屏
    if (t.y < MONTH_MODE_YEAR) return t.y >= et.y && t.y <= end.y;
    return absOf(t) >= absOf(et) && absOf(t) <= absOf(end);
  }
  if (t.y < MONTH_MODE_YEAR) return Math.abs(et.y - t.y) <= YEAR_WINDOW;
  return Math.abs(absOf(et) - absOf(t)) <= MONTH_WINDOW;
}

// 对一条路线做经度"解包"（unwrap）：保持相邻经度差在 (-180,180] 内，
// 使环球航线成为一条连续直线、随底图无限平铺延伸，不再在 ±180° 处回弹。
function unwrapRoute(poly) {
  const pts = [poly[0].slice()];
  for (let i = 1; i < poly.length; i++) {
    const [, lng1] = pts[i - 1];
    const [lat2, lng2] = poly[i];
    const diff = lng2 - lng1;
    const unwrapped = lng2 - Math.round(diff / 360) * 360;
    pts.push([lat2, unwrapped]);
  }
  return pts;
}

function renderRoutes() {
  if (routeLayer) { map.removeLayer(routeLayer); routeLayer = null; }
  routeLayer = L.layerGroup().addTo(map);
  routeLabels = [];
  for (const r of routes) {
    if (!routeVisible(r)) continue;
    // 经度解包为连续直线，随底图的世界平铺而无限延伸（跨日界线不再回弹）
    const pts = unwrapRoute(r.waypoints.map(w => w.pos));
    const line = L.polyline(pts, { color: r.color, weight: 3, opacity: 0.9, dashArray: '6 7' });
    line.bindPopup(routeLinePopupHTML(r), { maxWidth: 320 });
    routeLayer.addLayer(line);
    // 方向箭头：r.arrows=true 时在每个航段中点沿航向加一个旋转箭头
    if (r.arrows) {
      for (let i = 0; i < r.waypoints.length - 1; i++) {
        const [lat1, lng1] = r.waypoints[i].pos;
        const [lat2, lng2] = r.waypoints[i + 1].pos;
        // 用连续的“解包”经度计算航向，跨日界线时箭头方向才不会翻转
        let lng2u = lng2;
        if (lng1 - lng2 > 180) lng2u += 360;
        else if (lng2 - lng1 > 180) lng2u -= 360;
        const heading = Math.atan2(lng2u - lng1, lat2 - lat1) * 180 / Math.PI;
        const midLng = ((lng1 + lng2u) / 2 + 540) % 360 - 180;  // 航段中点的经度（归一到 [−180,180]）
        routeLayer.addLayer(L.marker([(lat1 + lat2) / 2, midLng], {
          interactive: false,
          icon: L.divIcon({
            className: '',
            html: `<span class="route-arrow" style="color:${r.color};transform:rotate(${heading - 90}deg)">➤</span>`,
            iconSize: [14, 14],
            iconAnchor: [7, 7]
          })
        }));
      }
    }
    r.waypoints.forEach(w => {
      const cm = L.circleMarker(w.pos, { radius: 7, color: '#fff', weight: 2, fillColor: r.color, fillOpacity: 0.85 });
      cm.bindPopup(waypointPopupHTML(r, w), { maxWidth: 280 });
      routeLayer.addLayer(cm);
      const lb = L.marker(w.pos, {

          className: '',
          html: `<div class="wp-label">${esc(w.name)}<br><span class="wp-date">${esc(w.date_short)}</span></div>`,

        })

      lb.bindPopup(waypointPopupHTML(r, w), { maxWidth: 280 });
      routeLabels.push(lb);

}

function activePhase(t) {

// === OpenHistoricalMap (OHM) 维基全时空历史地图图层集成 ===
function initOHMLayer() {
  if (ohmLayer || typeof L.maplibreGL === 'undefined') return;
  try {
    ohmLayer = L.maplibreGL({
      style: 'https://unpkg.com/@openhistoricalmap/map-styles@latest/dist/historical/historical.json',
      attribution: '&copy; <a href="https://www.openhistoricalmap.org/" target="_blank">OpenHistoricalMap</a> contributors'
    });
  } catch (e) {
    console.warn('OHM MapLibre 初始化异常:', e);
  }
}

function updateOHMFilter() {
  if (basemapMode !== 'ohm' || !ohmLayer) return;
  const glMap = ohmLayer.getMaplibreMap && ohmLayer.getMaplibreMap();
  if (!glMap || !glMap.isStyleLoaded()) return;
  const decDate = cur.y + (cur.m ? (cur.m - 1) / 12 : 0);
  const layers = glMap.getStyle()?.layers || [];
  for (const l of layers) {
    if (l.source === 'ohm') {
      try {
        glMap.setFilter(l.id, [
          'all',
          ['<=', ['coalesce', ['get', 'start_decdate'], -999999], decDate],
          ['>=', ['coalesce', ['get', 'end_decdate'], 999999], decDate]
        ]);
      } catch (e) {}
    }
  }
}

function switchBasemap(mode) {
  basemapMode = mode;
  const btn = document.getElementById('basemapBtn');
  if (mode === 'ohm') {
    if (!ohmLayer) initOHMLayer();
    if (ohmLayer) {
      const activeBase = tileLayers[theme];
      if (activeBase && map.hasLayer(activeBase)) map.removeLayer(activeBase);
      ohmLayer.addTo(map);
      if (btn) btn.textContent = '底图: OHM 维基';
      setTimeout(updateOHMFilter, 300);
    } else {
      alert('当前浏览器环境暂未加载 WebGL MapLibre 引擎，正在使用默认自然地形。您可通过右上角【🌐 探索 OHM 维基全景 ↗】直接在新窗口查看该年代 OHM 全景！');
    }
  } else {
    if (ohmLayer && map.hasLayer(ohmLayer)) map.removeLayer(ohmLayer);
    const activeBase = tileLayers[theme];
    if (activeBase && !map.hasLayer(activeBase)) activeBase.addTo(map);
    if (btn) btn.textContent = '底图: 自然地形';
  }
}

function renderNowBar(visible) {
  if (!visible.length) {
    document.getElementById('nowBar').innerHTML =
      `<span class="nb-year">${fmtTime(cur.y, cur.m)}</span>
       <span class="nb-col" style="color:var(--muted)">当前时段无重点事件</span>`;
    return;
  }
  const cAbs = absOf(cur);
  const sorted = [...visible].sort((a, b) => {
    if ((b.imp || 1) !== (a.imp || 1)) return (b.imp || 1) - (a.imp || 1);
    return Math.abs(absOf(tOfEvent(a)) - cAbs) - Math.abs(absOf(tOfEvent(b)) - cAbs);
  });
  const topEvents = sorted.slice(0, 2);
  
  let html = `<span class="nb-year">${fmtTime(cur.y, cur.m)}</span>`;
  for (const ev of topEvents) {
    const cat = getEventCategory(ev);
    const col = eventCatColor(cat);
    html += `<span class="nb-col"><b style="background:${col}">${cat.glyph}</b>${fmtRange(ev)} ${esc(ev.title)}</span>`;
  }
  document.getElementById('nowBar').innerHTML = html;
}

function renderList(visible) {
  const box = document.getElementById('eventList');
  const sorted = [...visible].sort((a, b) => absOf(tOfEvent(a)) - absOf(tOfEvent(b)));
  const activeRoutes = routes.filter(r => routeVisible(r));
  if (!sorted.length && !activeRoutes.length) {
    const unit = timeMode === 'year' ? '该年度' : (cur.y < MONTH_MODE_YEAR ? `±${YEAR_WINDOW} 年` : `±${MONTH_WINDOW} 个月`);
    box.innerHTML = activeTopics.size
      ? `<div class="empty">${unit} 内没有符合所选专题（${[...activeTopics].join('+')}）的事件。<br>换个时段或取消专题。</div>`
      : `<div class="empty">${unit} 内没有事件。<br>试试切换年份或拖动下方时间轴。</div>`;
    return;
  }
  const routeRows = activeRoutes.map(r => `
    <button class="ev-item" data-route="${esc(r.id)}">
      <span class="dot" style="background:${r.color}"></span>
      <span class="ev-year">${esc(r.year_label)}</span>
      <span class="ev-title">${esc(r.name_zh)}</span>
      <span class="ev-imp">↦ 路线</span>
    </button>`).join('');
  box.innerHTML = routeRows + sorted.map(e => {
    const cat = getEventCategory(e);
    const c = eventCatColor(cat);
    return `<button class="ev-item" data-id="${esc(e.id)}">
      <span class="cat-badge" style="background:${c}">${cat.glyph}</span>
      <span class="ev-year">${fmtRange(e)}</span>
      <span class="ev-title">${esc(e.title)}</span>
      <span class="ev-imp">${'★★☆'.slice(0, e.imp)}</span>
    </button>`;
  }).join('');
  box.querySelectorAll('.ev-item[data-route]').forEach(btn => {
    btn.addEventListener('click', () => flyRoute(btn.dataset.route));
  });
  box.querySelectorAll('.ev-item[data-id]').forEach(btn => {
    btn.addEventListener('click', () => selectEvent(btn.dataset.id));
  });
}

function renderEvents() {
  renderTerritories();
  renderLandmarks();
  updateOHMFilter();
  if (eventLayer) { map.removeLayer(eventLayer); eventLayer = null; }
  Object.keys(eventMarkers).forEach(k => delete eventMarkers[k]);
  eventLayer = L.layerGroup().addTo(map);

  // 标签优先模式：当启用时且选择了标签，忽略时间限制
  let visible;
  if (tagIgnoreTimeMode && activeTopics.size > 0) {
    visible = events.filter(e => topicOK(e));
  } else {
    visible = events.filter(e => inWindow(e, cur) && topicOK(e));
  }
  for (const e of visible) {
    const m = L.marker([e.lat, e.lon], { icon: makeEventIcon(e), title: `${fmtRange(e)} ${e.title}` })
      .bindPopup(eventPopupHTML(e), { maxWidth: 300 });
    m.on('click', () => selectEvent(e.id));
    eventLayer.addLayer(m);
    eventMarkers[e.id] = m;
  }
  renderNowBar(visible);
  renderList(visible);
  renderRoutes();
  document.getElementById('yearLabel').textContent = fmtTime(cur.y, cur.m);
  const filterNote = activeTopics.size ? `（专题：${[...activeTopics].join(' + ')}）` : '';
  let modeNote = '';
  if (tagIgnoreTimeMode && activeTopics.size > 0) {
    modeNote = ' · 标签优先模式：显示所有时间';
  }
  document.getElementById('countText').textContent = `显示 ${visible.length} / ${events.length} 个事件${filterNote}${modeNote}`;
  updateNavButtons();
}

function selectEvent(id) {
  selectedId = id;
  const m = eventMarkers[id];
  if (!m) return;
  m.openPopup();
  // 平移到事件位置时放大地图到一个带上下文的视野，便于看出它发生在世界的哪里。
  // 用一个以事件为中心、约±半视野经度/纬度的边界框；若该事件时间窗内还有其他事件，
  // 则把视野放宽到覆盖它们。
  const e = events.find(x => x.id === id);
  let vis;
  if (tagIgnoreTimeMode && activeTopics.size > 0) {
    // 标签优先模式下：只考虑当前标签匹配的其他事件
    vis = events.filter(x => x.id !== id && topicOK(x));
  } else {
    vis = events.filter(x => x.id !== id && inWindow(x, cur) && topicOK(x));
  }
  let bounds;
  if (e && vis.length) {
    bounds = L.latLngBounds(vis.map(x => [x.lat, x.lon]));
    bounds.extend([e.lat, e.lon]);
  } else {
    bounds = L.latLngBounds([[e.lat - 6, e.lon - 12], [e.lat + 6, e.lon + 12]]);
  }
  map.flyToBounds(bounds, { padding: [50, 50], maxZoom: 6, duration: 0.8 });
  document.querySelectorAll('.ev-item').forEach(r => r.classList.toggle('selected', r.dataset.id === id));
  updateURLState();
}

function nearestEventTime(dir) {
  const cAbs = absOf(cur);
  let best = null, bestDiff = Infinity;
  for (const e of events) {
    if (!topicOK(e)) continue;
    const a = absOf(tOfEvent(e));
    if (dir === 'prev' ? a >= cAbs : a <= cAbs) continue;
    const d = Math.abs(a - cAbs);
    if (d < bestDiff) { bestDiff = d; best = e; }
  }
  return best ? tOfEvent(best) : null;
}

// ===== 全局搜索 =====
let searchResultsVisible = false;
function searchMatch(e, q) {
  if (!q) return false;
  const fields = [e.title, e.era, e.note, e.lat, e.lon, (e.tags || []).join(' '), e.id].join(' ').toLowerCase();
  return fields.includes(q);
}
function renderSearchResults(q) {
  const box = document.getElementById('eventList');
  const hint = document.getElementById('searchHint');
  const clear = document.getElementById('searchClear');
  searchResultsVisible = !!q;
  clear.style.display = q ? 'inline-block' : 'none';
  if (!q) {
    hint.style.display = 'none';
    renderEvents();
    return;
  }
  const matched = events
    .filter(e => searchMatch(e, q))
    .sort((a, b) => absOf(tOfEvent(a)) - absOf(tOfEvent(b)));
  hint.style.display = 'block';
  hint.textContent = `搜索「${q}」：共 ${matched.length} 个匹配事件（跨时代）`;
  if (!matched.length) {
    box.innerHTML = `<div class="empty">没有匹配「${esc(q)}」的事件。<br>可尝试输入人名、朝代或关键词。</div>`;
    return;
  }
  for (const t of TOPICS) {
    if (t.toLowerCase().includes(q) && !activeTopics.has(t)) activeTopics.add(t);
  }
  box.innerHTML = matched.map(e => {
    const cat = getEventCategory(e);
    const c = eventCatColor(cat);
    return `<button class="ev-item" data-id="${esc(e.id)}">
      <span class="cat-badge" style="background:${c}">${cat.glyph}</span>
      <span class="ev-year">${fmtRange(e)}</span>
      <span class="ev-title">${esc(e.title)}</span>
      <span class="ev-imp">${'★★☆'.slice(0, e.imp)}</span>
    </button>`;
  }).join('');
  box.querySelectorAll('.ev-item[data-id]').forEach(btn => {
    btn.addEventListener('click', () => jumpToEvent(btn.dataset.id));
  });
}
function jumpToEvent(id) {
  const e = events.find(x => x.id === id);
  if (!e) return;
  cur = tOfEvent(e);
  if (timeMode === 'century') {
    activeCentury = Math.floor(cur.y / 100) * 100;
    const centurySel = document.getElementById('centurySelect');
    if (centurySel) centurySel.value = activeCentury;
    updateSliderBounds();
  } else if (timeMode === 'year') {
    activeYear = cur.y;
    const yearSel = document.getElementById('yearSelect');
    if (yearSel) yearSel.value = activeYear;
    updateSliderBounds();
  } else {
    document.getElementById('yearSlider').value = timeToSlider(cur);
  }
  renderEvents();
  selectEvent(id);
}

function step(dir) {
  const t = nearestEventTime(dir);
  if (!t) return;
  cur = t;
  if (timeMode === 'century') {
    activeCentury = Math.floor(cur.y / 100) * 100;
    const centurySel = document.getElementById('centurySelect');
    if (centurySel) centurySel.value = activeCentury;
    updateSliderBounds();
  } else if (timeMode === 'year') {
    activeYear = cur.y;
    const yearSel = document.getElementById('yearSelect');
    if (yearSel) yearSel.value = activeYear;
    updateSliderBounds();
  } else {
    document.getElementById('yearSlider').value = timeToSlider(cur);
  }
  renderEvents();
  // 标签优先模式下，不需要调整地图视野，因为标记已经全部显示
  if (!tagIgnoreTimeMode || activeTopics.size === 0) {
    const vis = events.filter(e => inWindow(e, cur) && topicOK(e));
    if (vis.length) {
      map.flyToBounds(L.latLngBounds(vis.map(e => [e.lat, e.lon])), { padding: [48, 48], duration: 0.6 });
    }
  }
}

function updateNavButtons() {
  const prev = nearestEventTime('prev');
  const next = nearestEventTime('next');
  const pb = document.getElementById('prevBtn2');
  const nb = document.getElementById('nextBtn2');
  if (pb) pb.disabled = prev == null;
  if (nb) nb.disabled = next == null;
}

function rebuildTheme() {
  document.documentElement.dataset.theme = theme;
  document.getElementById('themeToggle').textContent = theme === 'dark' ? '☀️ 亮色模式' : '🌙 深色模式';
  const tiles = tileLayers[theme];
  if (map) { tiles.addTo(map); tileLayers[theme === 'dark' ? 'light' : 'dark'].remove(); }
  for (const [id, m] of Object.entries(eventMarkers)) m.setIcon(makeEventIcon(events.find(e => e.id === id)));
  const visible = events.filter(e => inWindow(e, cur) && topicOK(e));
  renderNowBar(visible);
  renderList(visible);
}

async function init() {
  const res = await fetch('events.json');
  if (!res.ok) throw new Error('无法加载 events.json —— 请用本地服务器打开（python3 -m http.server）');
  events = await res.json();
  try {
    const rr = await fetch('routes.json');
    if (rr.ok) routes = await rr.json();
  } catch (e) { /* 旧部署可能没有 routes.json */ }
  try {
    const pr = await fetch('prehistory.json');
    if (pr.ok) prehistory = await pr.json();
  } catch (e) { /* 可选文件 */ }
  try {
    const tr = await fetch('territories.json');
    if (tr.ok) territories = await tr.json();
  } catch (e) { /* 旧部署可能没有 territories.json */ }
  try {
    const lr = await fetch('landmarks.json');
    if (lr.ok) landmarks = await lr.json();
  } catch (e) { /* 可选文件 */ }

  theme = 'light';
  try { const saved = localStorage.getItem('wh-theme'); if (saved === 'dark' || saved === 'light') theme = saved; } catch (e) {}
  document.documentElement.dataset.theme = theme;

  const lightTiles = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Terrain_Base/MapServer/tile/{z}/{y}/{x}',
    { attribution: 'Tiles &copy; Esri &mdash; USGS, Esri, DeLorme', maxZoom: 13 });
  const darkTiles = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Shaded_Relief/MapServer/tile/{z}/{y}/{x}',
    { attribution: 'Tiles &copy; Esri', maxZoom: 13 });
  tileLayers.light = lightTiles;
  tileLayers.dark = darkTiles;

  map = L.map('map', {
    center: [35, 60], zoom: 2, minZoom: 2, maxZoom: 12, zoomControl: true,
    worldCopyJump: true,
    layers: [theme === 'dark' ? darkTiles : lightTiles]
  });
  map.on('zoomend', () => { updateRouteLabels(); updateTerritoryLabels(); updateLandmarkLabels(); });
  map.on('moveend', () => { updateURLState(); });
  window.__map = map;

  MIN_YEAR = Math.min(...events.map(e => e.year));
  MAX_YEAR = Math.max(...events.map(e => e.year));
  YEAR_UNITS = MONTH_MODE_YEAR - MIN_YEAR;

  buildCenturyOptions();
  buildYearOptions();

  cur = { y: 9, m: 1 }; // 初始对照点：条顿堡惨败 ↔ 王莽篡汉（同年）
  const urlState = loadURLState();
  activeCentury = Math.floor(cur.y / 100) * 100;
  activeYear = (cur.y >= 1980 && cur.y <= 2026) ? cur.y : 2024;
  const centurySel = document.getElementById('centurySelect');
  if (centurySel) centurySel.value = activeCentury;
  const yearSel = document.getElementById('yearSelect');
  if (yearSel) yearSel.value = activeYear;

  const modeAllBtn = document.getElementById('modeAllBtn');
  const modeCenturyBtn = document.getElementById('modeCenturyBtn');
  const modeYearBtn = document.getElementById('modeYearBtn');

  if (timeMode === 'century') {
    modeCenturyBtn.classList.add('active');
    modeAllBtn.classList.remove('active');
    modeYearBtn.classList.remove('active');
    centurySel.style.display = 'inline-block';
    yearSel.style.display = 'none';
  } else if (timeMode === 'year') {
    modeYearBtn.classList.add('active');
    modeAllBtn.classList.remove('active');
    modeCenturyBtn.classList.remove('active');
    centurySel.style.display = 'none';
    yearSel.style.display = 'inline-block';
  } else {
    modeAllBtn.classList.add('active');
    modeCenturyBtn.classList.remove('active');
    modeYearBtn.classList.remove('active');
    centurySel.style.display = 'none';
    yearSel.style.display = 'none';
  }

  updateSliderBounds();

  const el = document.getElementById('yearSlider');
  el.addEventListener('input', () => {
    cur = sliderToTime(+el.value);
    renderEvents();
    updateURLState();
  });

  modeAllBtn.addEventListener('click', () => {
    timeMode = 'all';
    modeAllBtn.classList.add('active');
    modeCenturyBtn.classList.remove('active');
    modeYearBtn.classList.remove('active');
    centurySel.style.display = 'none';
    yearSel.style.display = 'none';
    updateSliderBounds();
    renderEvents();
    updateURLState();
  });
  
  modeCenturyBtn.addEventListener('click', () => {
    timeMode = 'century';
    modeCenturyBtn.classList.add('active');
    modeAllBtn.classList.remove('active');
    modeYearBtn.classList.remove('active');
    centurySel.style.display = 'inline-block';
    yearSel.style.display = 'none';
    activeCentury = Math.floor(cur.y / 100) * 100;
    centurySel.value = activeCentury;
    updateSliderBounds();
    renderEvents();
    updateURLState();
  });

  modeYearBtn.addEventListener('click', () => {
    timeMode = 'year';
    modeYearBtn.classList.add('active');
    modeAllBtn.classList.remove('active');
    modeCenturyBtn.classList.remove('active');
    centurySel.style.display = 'none';
    yearSel.style.display = 'inline-block';
    if (cur.y >= 1980 && cur.y <= 2026) {
      activeYear = cur.y;
    } else if (yearSel.querySelector(`option[value="${cur.y}"]`)) {
      activeYear = cur.y;
    } else {
      activeYear = 2024;
    }
    const yearEvs = events.filter(e => e.year === activeYear && e.month);
    const defMonth = yearEvs.length > 0 ? Math.min(...yearEvs.map(e => e.month)) : 1;
    cur = { y: activeYear, m: defMonth };
    yearSel.value = activeYear;
    updateSliderBounds();
    renderEvents();
    updateURLState();
  });

  centurySel.addEventListener('change', () => {
    activeCentury = parseInt(centurySel.value, 10);
    cur = { y: activeCentury, m: 1 };
    updateSliderBounds();
    renderEvents();
    updateURLState();
  });

  yearSel.addEventListener('change', () => {
    activeYear = parseInt(yearSel.value, 10);
    const yearEvs = events.filter(e => e.year === activeYear && e.month);
    const defMonth = yearEvs.length > 0 ? Math.min(...yearEvs.map(e => e.month)) : 1;
    cur = { y: activeYear, m: defMonth };
    updateSliderBounds();
    renderEvents();
    updateURLState();
  });

  document.getElementById('prevBtn2').addEventListener('click', () => step('prev'));
  document.getElementById('nextBtn2').addEventListener('click', () => step('next'));
  document.getElementById('routeBtn').addEventListener('click', () => {
    routeForced = routeForced === null ? true : (routeForced === true ? false : null);
    renderEvents();
    updateURLState();
  });
  document.getElementById('prehistoryBtn').addEventListener('click', () => {
    prehistoryVisible = !prehistoryVisible;
    renderPrehistory();
    renderPrehistoryToggle();
  });
  document.getElementById('territoryBtn').addEventListener('click', () => {
    territoryVisible = !territoryVisible;
    renderTerritories();
    renderTerritoryToggle();
  });
  document.getElementById('landmarkBtn').addEventListener('click', () => {
    landmarkVisible = !landmarkVisible;
    renderLandmarks();
    renderLandmarkToggle();
  });

  // 标签优先模式按钮
  const tagModeBtn = document.getElementById('tagTimelessMode');
  const tagModeStatus = document.getElementById('tagModeStatus');
  tagModeBtn.addEventListener('click', () => {
    tagIgnoreTimeMode = !tagIgnoreTimeMode;

    // 更新按钮状态
    tagModeBtn.classList.toggle('active', tagIgnoreTimeMode);

    // 更新状态文字
    if (tagIgnoreTimeMode) {
      tagModeBtn.textContent = '标签优先 ✓';
      tagModeStatus.textContent = '当前模式：标签优先（忽略时间）';
      tagModeBtn.title = '标签优先模式已启用：标签过滤将显示所有时间的事件';
    } else {
      tagModeBtn.textContent = '标签优先';
      tagModeStatus.textContent = '当前模式：标签+时间过滤';
      tagModeBtn.title = '标签优先模式：点击后标签过滤将显示所有时间的事件，忽略时间轴限制';
    }

    renderEvents();
  });

  buildTopicBar();

  const searchInput = document.getElementById('searchInput');
  const searchClear = document.getElementById('searchClear');
  searchInput.addEventListener('input', () => renderSearchResults(searchInput.value.trim().toLowerCase()));
  searchInput.addEventListener('keydown', ev => {
    if (ev.key === 'Enter') {
      const q = searchInput.value.trim().toLowerCase();
      const first = q && events.filter(e => searchMatch(e, q)).sort(
        (a, b) => absOf(tOfEvent(a)) - absOf(tOfEvent(b)))[0];
      if (first) jumpToEvent(first.id);
    }
  });
  searchClear.addEventListener('click', () => {
    searchInput.value = '';
    renderSearchResults('');
    searchInput.focus();
  });

  document.getElementById('themeToggle').addEventListener('click', () => {
    theme = theme === 'dark' ? 'light' : 'dark';
    try { localStorage.setItem('wh-theme', theme); } catch (e) {}
    rebuildTheme();
  });

  const basemapBtn = document.getElementById('basemapBtn');
  if (basemapBtn) {
    basemapBtn.addEventListener('click', () => {
      switchBasemap(basemapMode === 'terrain' ? 'ohm' : 'terrain');
    });
  }

  renderEvents();
  renderPrehistory();
  renderPrehistoryToggle();
  renderTerritoryToggle();
  renderLandmarkToggle();
  if (urlState.selectedEventId && eventMarkers[urlState.selectedEventId]) {
    selectEvent(urlState.selectedEventId);
  } else if (!urlState.mapSet) {
    map.fitBounds(L.latLngBounds(events.map(e => [e.lat, e.lon])), { padding: [40, 40] });
  }
  rebuildTheme();
  updateURLState();
}

init().catch(err => {
  document.getElementById('eventList').innerHTML = `<div class="empty">加载失败：${esc(err.message)}</div>`;
});
</script>
</body>
</html>
