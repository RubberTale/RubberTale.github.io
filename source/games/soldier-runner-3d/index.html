<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>小兵冲冲冲 3D</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:#0b1220;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    user-select:none;touch-action:none}
  #app{position:relative;width:100%;height:100%}
  #app canvas{display:block}
  .hud{position:absolute;inset:0;pointer-events:none;color:#fff}
  .topbar{display:flex;justify-content:space-between;align-items:flex-start;padding:14px 16px}
  .pill{background:rgba(15,23,42,.5);border:1px solid rgba(255,255,255,.16);border-radius:999px;
    padding:6px 14px;font-size:13px;font-weight:600;letter-spacing:.5px;white-space:nowrap}
  .count-wrap{text-align:center;margin-top:-6px;min-width:110px}
  .count-num{font-size:54px;font-weight:800;line-height:1;letter-spacing:-1.5px;
    text-shadow:0 3px 14px rgba(0,0,0,.5);transition:transform .12s ease;font-variant-numeric:tabular-nums}
  .count-num.pop{transform:scale(1.28)}
  .count-label{font-size:11px;letter-spacing:4px;opacity:.72;margin-top:3px}
  .hint{position:absolute;bottom:20px;left:0;right:0;text-align:center;font-size:13px;
    opacity:.85;transition:opacity .7s;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #popup{position:absolute;top:104px;left:0;right:0;text-align:center;pointer-events:none}
  .popup-item{font-size:32px;font-weight:800;animation:floatUp .95s ease-out forwards;
    text-shadow:0 3px 12px rgba(0,0,0,.6);font-variant-numeric:tabular-nums}
  .popup-item.good{color:#5df08d}
  .popup-item.bad{color:#ff7b7b}
  @keyframes floatUp{
    0%{opacity:0;transform:translateY(16px) scale(.7)}
    25%{opacity:1;transform:translateY(0) scale(1.12)}
    100%{opacity:0;transform:translateY(-50px) scale(1)}
  }
  .overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(8,12,20,.74);pointer-events:auto;transition:opacity .28s}
  .overlay.hidden{opacity:0;pointer-events:none}
  .card{background:rgba(20,28,42,.95);border:1px solid rgba(255,255,255,.14);border-radius:22px;
    padding:28px 30px 26px;text-align:center;max-width:330px;box-shadow:0 24px 60px rgba(0,0,0,.5)}
  .card h1{font-size:26px;font-weight:800;margin-bottom:8px;letter-spacing:-.5px}
  .card p{font-size:14px;line-height:1.65;opacity:.72;margin-bottom:18px}
  .card .stat{font-size:32px;font-weight:800;margin-bottom:16px;font-variant-numeric:tabular-nums;color:#5df08d}
  .card button{pointer-events:auto;border:0;border-radius:13px;padding:13px 42px;font-size:16px;
    font-weight:700;color:#06231a;background:#4ade80;cursor:pointer;font-family:inherit;transition:transform .1s}
  .card button:active{transform:scale(.96)}
  .audiobar{position:absolute;left:0;right:0;bottom:44px;display:flex;justify-content:center;
    gap:10px;align-items:center;pointer-events:none}
  .audio-btn{pointer-events:auto;width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.18);
    background:rgba(15,23,42,.55);color:#fff;cursor:pointer;display:flex;align-items:center;
    justify-content:center;font-size:16px;line-height:1;font-family:inherit;transition:transform .1s,background .2s}
  .audio-btn:active{transform:scale(.92)}
  .audio-btn.muted{background:rgba(15,23,42,.35);color:rgba(255,255,255,.45)}
  .vol-wrap{pointer-events:auto;display:flex;align-items:center;gap:8px;background:rgba(15,23,42,.55);
    border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:7px 14px}
  .vol-wrap input{-webkit-appearance:none;appearance:none;width:74px;height:4px;border-radius:2px;
    background:rgba(255,255,255,.3);outline:none;cursor:pointer}
  .vol-wrap input::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;
    background:#4ade80;cursor:pointer}
  .vol-wrap input::-moz-range-thumb{width:13px;height:13px;border:0;border-radius:50%;background:#4ade80;cursor:pointer}
  .vol-wrap span{font-size:11px;color:rgba(255,255,255,.6);font-variant-numeric:tabular-nums;min-width:20px;text-align:right}
  #flash{position:absolute;inset:0;pointer-events:none;opacity:0;background:#fff;
    mix-blend-mode:screen;transition:opacity .09s linear}
  .curse-tag{position:absolute;top:60px;left:0;right:0;text-align:center;pointer-events:none}
  .curse-item{display:inline-block;background:rgba(217,119,6,.92);color:#fff;font-size:12px;font-weight:700;
    padding:5px 13px;border-radius:999px;margin:0 3px 5px;animation:floatUp 1.7s ease-out forwards;
    box-shadow:0 4px 14px rgba(0,0,0,.35)}
</style>
</head>
<body>
<div id="app">
  <div class="hud">
    <div class="topbar">
      <div class="pill" id="roundLabel">第 1 关</div>
      <div class="count-wrap">
        <div class="count-num" id="countNum">1</div>
        <div class="count-label">兵力</div>
      </div>
      <div class="pill" id="progLabel">0%</div>
    </div>
    <div id="popup"></div>
    <div class="curse-tag" id="curseTag"></div>
    <div id="flash"></div>
    <div class="hint" id="hint">左右拖动屏幕 / ← → 控制方向<br><span style="font-size:11px;opacity:.75">橙色门数字更肥，但会留下代价 —— 兵力多时才划算</span></div>
    <div class="audiobar" id="audiobar" style="display:none">
      <button class="audio-btn" id="musicToggle" title="音乐开关" aria-label="音乐开关">♪</button>
      <div class="vol-wrap">
        <input type="range" id="musicVol" min="0" max="100" value="60" aria-label="音量">
        <span id="volLabel">60</span>
      </div>
    </div>
    <div class="overlay" id="overlay">
      <div class="card">
        <h1 id="ovTitle">小兵冲冲冲 3D</h1>
        <div class="stat" id="ovStat" style="display:none">0</div>
        <p id="ovText">穿过数字门把兵力变大<br>然后撞碎挡路的敌兵<br><br><span style="font-size:12px;opacity:.68">橙色门数字更肥，但会留下代价<br>兵力少时它反而亏 —— 看清楚再选</span></p>
        <button id="ovBtn">开始</button>
      </div>
    </div>
  </div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const MAX_COUNT = 9999;

/* ================= renderer / scene ================= */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
$('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9ecdf2);
scene.fog = new THREE.Fog(0x9ecdf2, 46, 138);

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 400);

scene.add(new THREE.HemisphereLight(0xffffff, 0x6f9450, 1.15));
const sun = new THREE.DirectionalLight(0xfff6e5, 1.25);
sun.position.set(8, 18, 10);
scene.add(sun);

const world = new THREE.Group();
scene.add(world);

/* ================= scenery ================= */
const TRACK_LEN = 1400;
const TRACK_MID = -500;

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(700, TRACK_LEN + 900),
  new THREE.MeshLambertMaterial({ color: 0x7fc45f })
);
ground.rotation.x = -Math.PI / 2;
ground.position.set(0, 0, TRACK_MID);
world.add(ground);

function makeRoadTexture() {
  const c = document.createElement('canvas');
  c.width = 128; c.height = 256;
  const x = c.getContext('2d');
  x.fillStyle = '#5b6068'; x.fillRect(0, 0, 128, 256);
  x.fillStyle = '#e9edf2'; x.fillRect(3, 0, 6, 256); x.fillRect(119, 0, 6, 256);
  x.fillRect(60, 24, 8, 104);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(1, 180);
  t.anisotropy = 4;
  return t;
}
const road = new THREE.Mesh(
  new THREE.PlaneGeometry(8.4, TRACK_LEN),
  new THREE.MeshLambertMaterial({ map: makeRoadTexture() })
);
road.rotation.x = -Math.PI / 2;
road.position.set(0, 0.02, TRACK_MID);
world.add(road);

const railGeo = new THREE.BoxGeometry(0.34, 0.7, TRACK_LEN);
const railMat = new THREE.MeshLambertMaterial({ color: 0xe2e7ee });
function addRails() {
  for (const sx of [-4.5, 4.5]) {
    const r = new THREE.Mesh(railGeo, railMat);
    r.position.set(sx, 0.35, TRACK_MID);
    world.add(r);
  }
}
addRails();

/* ================= crowd ================= */
const MAX_VISUAL = 64;

class Crowd {
  constructor(opts) {
    this.dir = opts.dir;
    this.spread = opts.spread || 0.44;
    this.group = new THREE.Group();
    world.add(this.group);
    this.geoBody = new THREE.BoxGeometry(0.32, 0.48, 0.24);
    this.geoHead = new THREE.SphereGeometry(0.135, 8, 6);
    this.matA = new THREE.MeshLambertMaterial({ color: opts.body });
    this.matB = new THREE.MeshLambertMaterial({ color: opts.body2 });
    this.matHead = new THREE.MeshLambertMaterial({ color: opts.head });
    this.units = [];
    this.dying = [];
    this.count = 0;
    this.base = new THREE.Vector3();

    /* ---- 远军人海层 ----
       MAX_VISUAL=64 是性能上限，但"我身后有 3000 个兵"这件事必须看得见。
       做法：超出精模上限的部分，用一个廉价的点云在队伍后方铺开，
       按数量级决定铺多远。纯几何、无序渲染、一个 draw call。 */
    this.HORDE_MAX = 900;
    this.hordePos = new Float32Array(this.HORDE_MAX * 3);
    const hg = new THREE.BufferGeometry();
    hg.setAttribute('position', new THREE.BufferAttribute(this.hordePos, 3));
    this.hordeMat = new THREE.PointsMaterial({
      color: opts.body, size: this.spread * 0.62, sizeAttenuation: true, fog: true
    });
    this.horde = new THREE.Points(hg, this.hordeMat);
    this.horde.frustumCulled = false;
    this.group.add(this.horde);
    this.hordeN = 0;
    this.hordeGeo = hg;
  }
  /* 超出精模的部分用点云表示：数量越多铺得越深越宽，
     让人一眼看出"这是人海"，而不是只有一小撮。
     ⚠️ 铺在"前方"而不是身后 —— 相机在玩家背后 11 米朝前看，
     铺在身后等于塞在相机与玩家之间，只能看到脚边一堆点，
     "我领着大军"的观感完全传不出来。 */
  updateHorde() {
    const extra = Math.max(0, this.count - this.units.length);
    if (!extra) { this.horde.visible = false; return; }
    this.horde.visible = true;
    // 用对数增长，避免 9999 人时铺出几公里
    const n = Math.min(this.HORDE_MAX, Math.round(
      this.HORDE_MAX * Math.log10(1 + extra) / Math.log10(1 + 4000)));
    this.hordeN = n;
    const sp = this.spread;
    // 从精模阵列的最后一排继续往前延伸，和前排连成一片（不另起一拨人）
    const tailZ = -Math.ceil(this.units.length / 22) * sp * 1.7 * this.dir;
    // 22 列 × 0.38 ≈ 8.4 米，比路面（半宽 4.2）还宽 —— 必须收窄，
    // 否则人海会糊到草地和护栏外面去。按路面宽度的 78% 来限制。
    const cols = 22;
    const xLimit = 3.2;
    const step = (xLimit * 2) / cols;
    for (let i = 0; i < n; i++) {
      const row = Math.floor(i / cols);
      const col = i % cols;
      // 加抖动：规整网格看起来像贴图，不像人群
      const jx = (Math.random() - 0.5) * step * 0.9;
      const jz = (Math.random() - 0.5) * sp * 1.1;
      const rowW = Math.min(1, 0.72 + row * 0.02);
      this.hordePos[i * 3] = (col - (cols - 1) / 2) * step * rowW + jx;
      this.hordePos[i * 3 + 1] = 0.3 + Math.random() * 0.12;
      // dir<0（玩家）时继续向 -z（前方）铺开
      this.hordePos[i * 3 + 2] = tailZ + (row + 1) * sp * 1.7 * this.dir + jz;
    }
    this.hordeGeo.attributes.position.needsUpdate = true;
    this.hordeGeo.setDrawRange(0, n);
  }
  makeUnit() {
    const g = new THREE.Group();
    const b = new THREE.Mesh(this.geoBody, Math.random() < 0.5 ? this.matA : this.matB);
    b.position.y = 0.38;
    const h = new THREE.Mesh(this.geoHead, this.matHead);
    h.position.y = 0.71;
    g.add(b, h);
    g.userData.ph = Math.random() * Math.PI * 2;
    g.scale.setScalar(0.01);
    this.group.add(g);
    return g;
  }
  setCount(n) {
    this.count = Math.max(0, Math.round(n));
    const v = Math.min(this.count, MAX_VISUAL);
    while (this.units.length < v) this.units.push(this.makeUnit());
    while (this.units.length > v) this.dying.push({ obj: this.units.pop(), t: 0 });
    this.layout();
    this.updateHorde();
  }
  layout() {
    const n = this.units.length;
    if (!n) return;
    const cols = Math.max(1, Math.ceil(Math.sqrt(n * 2.2)));
    const sp = this.spread;
    this.units.forEach((u, i) => {
      const col = i % cols, row = Math.floor(i / cols);
      u.userData.ox = (col - (cols - 1) / 2) * sp + (Math.random() - 0.5) * 0.06;
      u.userData.oz = -row * sp * 1.7 * this.dir;
    });
  }
  update(t, dt) {
    const b = this.base;
    for (const u of this.units) {
      const d = u.userData;
      u.position.set(b.x + d.ox, Math.abs(Math.sin(t * 9 + d.ph)) * 0.1, b.z + d.oz);
      u.rotation.y = this.dir < 0 ? 0 : Math.PI;
      if (u.scale.x < 1) u.scale.setScalar(Math.min(1, u.scale.x + dt * 7));
    }
    // 远军人海跟着队伍走，只做整体平移，不动点数据
    if (this.horde.visible) this.horde.position.set(b.x, 0, b.z);
    for (let i = this.dying.length - 1; i >= 0; i--) {
      const d = this.dying[i];
      d.t += dt;
      d.obj.scale.setScalar(Math.max(0, 1 - d.t / 0.38));
      d.obj.rotation.z += dt * 14;
      d.obj.position.y += dt * 1.4;
      if (d.t >= 0.38) { this.group.remove(d.obj); this.dying.splice(i, 1); }
    }
  }
  dispose() { world.remove(this.group); }
}

/* ================= gates ================= */
const opLabel = (op) => op.t + op.v;
const GATE_HALF = 4.1;

function makePanelTexture(text, good, sub) {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 168;
  const x = c.getContext('2d');
  x.clearRect(0, 0, 256, 168);
  // 交换门用琥珀色：一眼能看出"这扇门有代价"
  x.fillStyle = good ? (sub ? 'rgba(217,119,6,.58)' : 'rgba(22,163,74,.5)') : 'rgba(220,38,38,.5)';
  x.fillRect(0, 0, 256, 168);
  x.strokeStyle = good ? (sub ? '#fde68a' : '#bbf7d0') : '#fecaca';
  x.lineWidth = 11;
  x.strokeRect(6, 6, 244, 156);
  x.fillStyle = '#ffffff';
  x.font = '800 84px system-ui,-apple-system,sans-serif';
  x.textAlign = 'center';
  x.textBaseline = 'middle';
  x.fillText(text, 128, sub ? 76 : 88);
  if (sub) {
    x.font = '700 27px system-ui,-apple-system,sans-serif';
    x.fillStyle = '#fff7ed';
    x.fillText(sub, 128, 137);
  }
  const t = new THREE.CanvasTexture(c);
  t.anisotropy = 4;
  return t;
}

function buildGate(z, left, right) {
  const g = new THREE.Group();
  g.position.z = z;
  const postGeo = new THREE.BoxGeometry(0.17, 3.4, 0.17);
  const lintelGeo = new THREE.BoxGeometry(GATE_HALF, 0.2, 0.2);
  const sides = [
    { op: left, cx: -GATE_HALF / 2, good: left.t === '+' || left.t === '×' },
    { op: right, cx: GATE_HALF / 2, good: right.t === '+' || right.t === '×' }
  ];
  const panels = [];
  for (const s of sides) {
    const cursed = !!s.op.curse;
    const mat = new THREE.MeshLambertMaterial({ color: cursed ? 0xf59e0b : s.good ? 0x22c55e : 0xef4444 });
    const p1 = new THREE.Mesh(postGeo, mat); p1.position.set(s.cx - GATE_HALF / 2, 1.7, 0);
    const p2 = new THREE.Mesh(postGeo, mat); p2.position.set(s.cx + GATE_HALF / 2, 1.7, 0);
    const lin = new THREE.Mesh(lintelGeo, mat); lin.position.set(s.cx, 3.3, 0);
    g.add(p1, p2, lin);
    const pmat = new THREE.MeshBasicMaterial({
      map: makePanelTexture(opLabel(s.op), s.good, curseText(s.op)),
      transparent: true, side: THREE.DoubleSide, depthWrite: false
    });
    const panel = new THREE.Mesh(new THREE.PlaneGeometry(GATE_HALF - 0.18, 2.5), pmat);
    panel.position.set(s.cx, 1.62, 0);
    g.add(panel);
    panels.push(panel);
  }
  world.add(g);
  return { group: g, panels, fade: 1 };
}

function buildFinish(z) {
  const g = new THREE.Group();
  g.position.z = z;

  const c = document.createElement('canvas');
  c.width = 512; c.height = 128;
  const x = c.getContext('2d');
  x.fillStyle = 'rgba(15,23,42,.94)'; x.fillRect(0, 0, 512, 128);
  x.fillStyle = '#ffffff';
  x.font = '800 78px system-ui,-apple-system,sans-serif';
  x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText('终 点', 256, 68);

  const mat = new THREE.MeshLambertMaterial({ color: 0x1e293b });
  for (const sx of [-4.1, 4.1]) {
    const p = new THREE.Mesh(new THREE.BoxGeometry(0.22, 5, 0.22), mat);
    p.position.set(sx, 2.5, 0);
    g.add(p);
  }
  const banner = new THREE.Mesh(
    new THREE.PlaneGeometry(8.2, 2.0),
    new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c), side: THREE.DoubleSide })
  );
  banner.position.set(0, 4.2, 0);
  g.add(banner);

  const cc = document.createElement('canvas');
  cc.width = 128; cc.height = 128;
  const cx = cc.getContext('2d');
  for (let i = 0; i < 8; i++) for (let j = 0; j < 8; j++) {
    cx.fillStyle = ((i + j) % 2) ? '#111827' : '#f9fafb';
    cx.fillRect(i * 16, j * 16, 16, 16);
  }
  const ct = new THREE.CanvasTexture(cc);
  ct.wrapS = ct.wrapT = THREE.RepeatWrapping;
  ct.repeat.set(3, 1);
  const strip = new THREE.Mesh(new THREE.PlaneGeometry(8.4, 2.4), new THREE.MeshLambertMaterial({ map: ct }));
  strip.rotation.x = -Math.PI / 2;
  strip.position.set(0, 0.03, 0);
  g.add(strip);
  world.add(g);
}

/* ================= enemy count sprite ================= */
function makeCountSprite() {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 128;
  const tex = new THREE.CanvasTexture(c);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, fog: false, depthTest: true }));
  sp.scale.set(2.6, 1.3, 1);
  sp.userData.canvas = c;
  sp.userData.tex = tex;
  return sp;
}
function drawCountSprite(sp, n) {
  const c = sp.userData.canvas;
  const x = c.getContext('2d');
  x.clearRect(0, 0, 256, 128);
  x.fillStyle = 'rgba(185,28,28,.92)';
  const r = 22, w = 200, h = 92, px = 28, py = 18;
  x.beginPath();
  x.moveTo(px + r, py);
  x.arcTo(px + w, py, px + w, py + h, r);
  x.arcTo(px + w, py + h, px, py + h, r);
  x.arcTo(px, py + h, px, py, r);
  x.arcTo(px, py, px + w, py, r);
  x.closePath(); x.fill();
  x.fillStyle = '#fff';
  x.font = '800 58px system-ui,-apple-system,sans-serif';
  x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText(String(n), 128, 66);
  sp.userData.tex.needsUpdate = true;
}

/* ================= music =================
   用 WebAudio 现场合成，不加载任何外部音频文件——单文件游戏零依赖，
   也不牵扯他人作品的授权。想换成真实曲子的话，把下面 LOOPS 里对应的
   音符数组换成你自己录/买断的音频文件即可（见文件末尾注释）。
========================================== */
const MUSIC = (() => {
  const NOTE = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
  const freq = (n) => 440 * Math.pow(2, (n - 69) / 12);
  // 把 "C4" "F#3" 之类写成 MIDI 号
  function n(name) {
    const m = /^([A-G])(#?)(-?\d)$/.exec(name);
    return NOTE[m[1]] + (m[2] ? 1 : 0) + (parseInt(m[3], 10) + 1) * 12;
  }
  const seq = (arr) => arr.map((x) => (typeof x === 'string' ? n(x) : x));

  // 每条循环：和弦行进 + 旋律 + 低音，step 为八分音符
  const LOOPS = {
    // 主跑动：轻快、明亮，四个和弦来回
    run: {
      step: 0.125,
      chords: [['C3', 'E3', 'G3'], ['A2', 'C3', 'E3'], ['F2', 'A2', 'C3'], ['G2', 'B2', 'D3']],
      melody: seq(['C5','E5','G5','E5','C5','E5','A5','G5',
                   'A4','C5','E5','C5','F5','E5','D5','C5',
                   'F5','A5','C6','A5','G5','F5','E5','D5',
                   'G5','B5','D6','B5','C6','G5','E5','C5']),
      bars: 4
    },
    // 交战：下行动机 + 更密的鼓点
    fight: {
      step: 0.11,
      chords: [['A2', 'C3', 'E3'], ['F2', 'A2', 'C3'], ['G2', 'B2', 'D3'], ['A2', 'C3', 'E3']],
      melody: seq(['A4','A4','G4','E4','F4','F4','E4','C4',
                   'G4','G4','F4','D4','E4','G4','A4','B4',
                   'A4','C5','E5','D5','F5','E5','D5','C5',
                   'G4','B4','D5','B4','A4','E5','C5','A4']),
      bars: 4,
      drive: true
    },
    // 通关：上行的明亮小段
    win: {
      step: 0.13,
      chords: [['C3', 'E3', 'G3'], ['F2', 'A2', 'C3'], ['G2', 'B2', 'D3'], ['C3', 'E3', 'G3']],
      melody: seq(['C5','E5','G5','C6','G5','E5','G5','C6',
                   'F5','A5','C6','A5','G5','F5','E5','D5',
                   'G5','B5','D6','B5','C6','G5','E5','C5',
                   'E5','G5','C6','E6','C6','G5','E5','C5']),
      bars: 4
    },
    // 失败：缓慢下行
    over: {
      step: 0.17,
      chords: [['A2', 'C3', 'E3'], ['F2', 'A2', 'C3'], ['D2', 'F2', 'A2'], ['E2', 'G2', 'B2']],
      melody: seq(['A4','G4','F4','E4','D4','E4','F4','E4',
                   'D4','C4','B3','C4','B3','A3','G3','A3',
                   'F4','E4','D4','C4','B3','C4','D4','E4',
                   'E4','D4','C4','B3','A3','G3','A3','A3']),
      bars: 4
    }
  };

  let ctx = null, master = null, timer = null, step = 0, loopName = 'run';
  let enabled = true, volume = 0.6, started = false;
  const LOOKAHEAD = 0.12;   // 提前排程的秒数
  const TICK_MS = 25;

  function ensure() {
    if (ctx) return true;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    ctx = new AC();
    master = ctx.createGain();
    master.gain.value = 0;
    master.connect(ctx.destination);
    return true;
  }

  function voice(freqHz, at, dur, type, gain) {
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freqHz, at);
    // 简单包络，避免爆音
    g.gain.setValueAtTime(0, at);
    g.gain.linearRampToValueAtTime(gain, at + Math.min(0.02, dur * 0.25));
    g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
    o.connect(g); g.connect(master);
    o.start(at); o.stop(at + dur + 0.02);
  }

  function scheduleStep(i, at) {
    const L = LOOPS[loopName];
    const beat = L.step;
    const bar = Math.floor(i / 8) % L.bars;
    const sub = i % 8;
    const chord = L.chords[bar];
    const mel = L.melody[(bar * 8 + sub) % L.melody.length];

    // 和弦铺底：每小节第一拍
    if (sub === 0) {
      chord.forEach((nm, k) => voice(freq(n(nm)), at, beat * 7, 'triangle', 0.055 - k * 0.008));
    }
    // 低音：每拍
    if (sub % 2 === 0) voice(freq(n(chord[0]) - 12), at, beat * 1.6, 'sine', 0.10);
    // 旋律
    if (mel) voice(freq(mel), at, beat * 0.92, 'square', 0.042);
    // 打击
    if (L.drive) {
      if (sub % 4 === 0) noise(at, 0.055, 0.16);
      else if (sub % 2 === 0) noise(at, 0.022, 0.06);
    } else if (sub === 0 || sub === 4) {
      noise(at, 0.035, 0.08);
    }
  }

  function noise(at, dur, gain) {
    const len = Math.max(1, Math.floor(ctx.sampleRate * dur));
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const s = ctx.createBufferSource();
    s.buffer = buf;
    const g = ctx.createGain();
    g.gain.value = gain;
    const f = ctx.createBiquadFilter();
    f.type = 'highpass'; f.frequency.value = 1400;
    s.connect(f); f.connect(g); g.connect(master);
    s.start(at);
  }

  function pump() {
    if (!ctx) return;
    const L = LOOPS[loopName];
    while (nextTime < ctx.currentTime + LOOKAHEAD) {
      scheduleStep(step++, nextTime);
      nextTime += L.step;
    }
  }
  let nextTime = 0;

  function startLoop() {
    if (!ensure()) return;
    if (ctx.state === 'suspended') ctx.resume();
    nextTime = Math.max(nextTime, ctx.currentTime + 0.06);
    if (!timer) timer = setInterval(pump, TICK_MS);
    pump();
  }

  function stopLoop() {
    if (timer) { clearInterval(timer); timer = null; }
    if (master && ctx) {
      master.gain.cancelScheduledValues(ctx.currentTime);
      master.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.25);
    }
  }

  return {
    get enabled() { return enabled; },
    get volume() { return volume; },
    play(name) {
      if (!enabled) return;
      if (name && LOOPS[name]) loopName = name;
      if (!started) { started = true; }
      startLoop();
      if (master && ctx) {
        master.gain.cancelScheduledValues(ctx.currentTime);
        master.gain.linearRampToValueAtTime(volume, ctx.currentTime + 0.4);
      }
    },
    pause() { stopLoop(); },
    setEnabled(on) {
      enabled = on;
      if (!on) stopLoop();
      else if (started) this.play();
    },
    setVolume(v) {
      volume = clamp(v, 0, 1);
      if (master && ctx && enabled) master.gain.setValueAtTime(volume, ctx.currentTime);
    },
    // 测试钩子用
    _peek() { return { ctxState: ctx ? ctx.state : null, running: !!timer, step, loopName }; }
  };
})();

/* ================= level director ================= */
const GATE_GAP = 18, ENEMY_GAP = 30, FINISH_GAP = 20, START_Z = -34, HORIZON = 72;
const GATE_COUNTS = [2, 2, 3, 3, 3];
const DBL_POS = 0.7, F0 = 0.35, FSTEP = 0.05, FSPAN = 0.18;

const PLAN = (() => {
  const p = [];
  for (const gc of GATE_COUNTS) { for (let k = 0; k < gc; k++) p.push('gate'); p.push('enemy'); }
  p.push('finish');
  return p;
})();

function planFinishZ() {
  let c = START_Z;
  for (const t of PLAN) {
    if (t === 'finish') return c;
    c -= (t === 'gate' ? GATE_GAP : ENEMY_GAP);
  }
  return c;
}
const TOTAL_DIST = -planFinishZ();

function applyOp(op, n) {
  if (op.t === '+') return Math.min(MAX_COUNT, n + op.v);
  if (op.t === '-') return Math.max(1, n - op.v);
  if (op.t === '×') return Math.min(MAX_COUNT, n * op.v);
  return Math.max(1, Math.floor(n / op.v));
}

/* 门结算的唯一入口：先算账面，再砍上限，最后处理"先扣三成"。
   所有会影响兵力的路径都必须走这里，否则诅咒门的代价会被绕过。
   注意上限只"挡增长"、不"没收存量"：n 已经超过上限时维持原状，
   让玩家能在一扇坏门之后靠好门慢慢爬回来，而不是直接腰斩。 */
function resolveGate(op, n) {
  let v = applyOp(op, n);
  const cap = softCap();
  // 上限只挡"增长"：想涨到 cap 以上就停在 cap；
  // 但如果原本就已经超过 cap（被后来的诅咒压低），
  // 就用 max 保持原值，绝不让一扇门把存量腰斩
  if (v > cap) v = Math.max(n, cap);
  if (op.curse === 'tax') v = Math.max(1, Math.floor(v * 0.7));
  return v;
}

/* ---------- 交换门：账面上很强，但附带代价 ----------
   这是让"选门"从计算题变成权衡题的关键：
   单看数字它永远是最优解，但代价会在后面几关反咬你一口。 */
const CURSES = {
  // 上限降到 70%（不是腰斩，避免叠加两次直接变 1/4 导致永久残废），
  // 同时敌兵同步缩水 30% 作为对冲 —— 打的是小规模精兵局。
  cap: {
    label: '上限 70%',
    apply: () => { capMul = Math.max(0.35, capMul * 0.7); swarmMul *= 0.75; },
    risk: true
  },
  // 下关转向失灵：冲得快，但躲不掉
  drift: {
    label: '下关难控',
    apply: () => { steerLock = 1; },
    risk: true
  },
  // 后续敌兵增强：拿得多，打得也狠。
  // 关键：swarm 必须同时抬高"玩家能拿到的量级"，否则它就是纯死刑 ——
  // 因为敌兵是按 par 缩放的，单方面放大敌兵会让 mine > foe 永远不成立。
  swarm: {
    label: '敌兵增强',
    apply: () => { swarmMul = Math.min(2.6, swarmMul * 1.45); capMul = Math.min(1, capMul * 1.5); },
    risk: true
  },
  // 兵力税：立即扣掉一部分，换取更高的倍数
  tax: {
    label: '先扣三成',
    apply: () => {},
    risk: true
  }
};

// 交换门按"每关配额"出现，而不是掷骰子。
// 早期版本用 Math.random() < 0.42，实测每局只撞到 4.3 个、首关仅 22% 的门面 ——
// 玩家大部分时间看到的都是普通门，根本感觉不到"这游戏有取舍"。
// 经验：概率型效果的出现率必须远高于 50% 才成立，否则改成确定性配额。
//
// ⚠️ 但配额不能等于"本关门数" —— 那样每个门都带代价，失去了参照物，
// 而且代价叠加会让关卡变成数学上的必死。必须永远留至少一个纯正面门。
// GATE_COUNTS = [2,2,3,3,3]，所以配额取"本关门数 - 1"。
let curseLeft = 0;        // 本关还剩几个交换门配额没放
let gatesLeftInRound = 0; // 本关还剩几个门没放（用来保证至少留一个正常门）

function maybeCurseOp(base) {
  gatesLeftInRound--;
  // 只剩最后一个门时必须给正常门：代价要有"不选的选项"才成立
  if (curseLeft <= 0 || gatesLeftInRound < 1) return base;
  curseLeft--;
  const keys = ['cap', 'drift', 'swarm', 'tax'];
  const k = keys[Math.floor(Math.random() * keys.length)];
  // 有代价就必须给甜头：把基础效果显著加强
  if (k === 'tax') return { t: '×', v: Math.random() < 0.5 ? 3 : 4, curse: 'tax' };
  if (base.t === '×') return { t: '×', v: Math.min(6, base.v + 2), curse: k };
  return { t: '×', v: 3, curse: k };
}

// 每关开始时按"本关门数"发配额：一半左右的门带代价，
// 剩下的一半是纯正面门，这样"选哪个"才是个真问题。
function setRoundCurseQuota() {
  const gi = Math.min(roundNo - 1, GATE_COUNTS.length - 1);
  const n = GATE_COUNTS[gi];
  gatesLeftInRound = n;
  curseLeft = Math.max(1, Math.floor(n / 2));   // 2门→1个, 3门→1个
}

const curseText = (op) => (op && op.curse ? CURSES[op.curse].label : '');

function pickGood(E) {
  if (E < 4) return { t: '+', v: 8 + Math.floor(Math.random() * 7) };
  const pool = [
    { t: '+', v: Math.max(8, Math.round(E * (0.7 + Math.random() * 0.5))) },
    { t: '×', v: 2 }
  ];
  if (Math.random() < 0.15) pool.push({ t: '×', v: 3 });
  return pool[Math.floor(Math.random() * pool.length)];
}

function pickBad(E) {
  if (E < 5) return Math.random() < 0.5
    ? { t: '+', v: 1 + Math.floor(Math.random() * 2) }
    : { t: '-', v: 2 + Math.floor(Math.random() * 3) };
  const pool = [
    { t: '÷', v: 2 },
    { t: '-', v: Math.max(3, Math.round(E * 0.3)) },
    { t: '+', v: Math.max(3, Math.round(E * 0.15)) }
  ];
  return pool[Math.floor(Math.random() * pool.length)];
}
function genPair(E) {
  let a = maybeCurseOp(pickGood(E));
  // 如果 a 是交换门（通常是 ×3~×6 的大倍数），另一侧必须是"量级相当"的
  // 正常门，否则 ×3 vs +3 这种比较根本没有悬念 —— 玩家闭眼选橙色，
  // "权衡"就不存在了。让正常门给到接近玩家的当前兵力，才有得比。
  let b;
  if (a.curse) {
    b = Math.random() < 0.5
      ? { t: '+', v: Math.max(6, Math.round(E * (0.9 + Math.random() * 0.6))) }
      : { t: '×', v: 2 };
  } else {
    b = Math.random() < DBL_POS ? { t: '+', v: Math.max(3, Math.round(E * 0.3)) } : pickBad(E);
  }
  // 排序必须用 resolveGate：par 和玩家走的是同一套结算（含上限与代价），
  // 否则 par 会一路虚高，后面的敌兵直接变成不可能完成的任务
  if (resolveGate(a, E) < resolveGate(b, E)) { const t = a; a = b; b = t; }
  const flip = Math.random() < 0.5;
  return { left: flip ? a : b, right: flip ? b : a };
}

/* ================= game state ================= */
const state = {
  phase: 'ready',
  count: 1,
  x: 0,
  targetX: 0,
  z: 0,
  speed: 13.5,
  round: 1
};

let playerCrowd = null;
let pending = [];
let planIdx = 0;
let cursor = START_Z;
let par = 1;
let roundNo = 1;

/* 交换门留下的"后遗症" */
let capMul = 1;        // 兵力上限倍率（cap 诅咒会把天花板压下来）
let steerLock = 0;     // >0 表示接下来一段时间转向迟钝（drift 诅咒）
let swarmMul = 1;      // 敌兵强度倍率（swarm 诅咒累加）
// 上限随 capMul 浮动。注意这是个"增长上限"，不是"当前兵力的上限"——
// 已经拿到的兵不会被诅咒没收，诅咒只是让后面长得更慢。
// 否则会出现"玩家 2500 人、上限却被压到 1250、下扇门立刻腰斩"的荒谬情况。
const softCap = () => Math.max(12, Math.round(MAX_COUNT * capMul));
// 计算敌兵时用的天花板：不能低于玩家此刻手上的兵力，
// 否则会生成一个"按封顶值算、却比玩家上限还高"的必死敌人
const battleCap = () => Math.max(softCap(), state.count);

// 每过一关，上限的惩罚回血一点。
// 没有这个"回血"，cap 诅咒就是单向死刑：上限一旦被压低，
// par 和敌兵都会跟着缩水，玩家再也长不回原来的量级。
function recoverCaps() {
  if (capMul < 1) capMul = Math.min(1, capMul + 0.16);
  if (swarmMul > 1) swarmMul = Math.max(1, swarmMul * 0.88);
}

const battle = { t: 0, clashed: false, enemy: null, startZ: 0, result: null };
let shake = 0;
let hitstop = 0;         // >0 时时间冻结，撞击的"顿帧"打击感
let timeScale = 1;       // 慢镜头用

function spawnNext() {
  if (planIdx >= PLAN.length) return;
  const type = PLAN[planIdx++];
  if (type === 'gate') {
    const p = genPair(par);
    // par 表示"最优路径下的预期兵力"，必须经过同一套结算（含上限），
    // 否则被 cap 诅咒压住时难度估算会虚高、后面直接卡死
    par = Math.max(resolveGate(p.left, par), resolveGate(p.right, par));
    pending.push({
      type: 'gate', z: cursor, left: p.left, right: p.right, resolved: false,
      vis: buildGate(cursor, p.left, p.right)
    });
    cursor -= GATE_GAP;
  } else if (type === 'enemy') {
    const f = F0 + (roundNo - 1) * FSTEP + Math.random() * FSPAN;
    // 敌兵强度以"玩家实际能到的高度"为基准，而不是 par 这个理论值。
    // 用 battleCap() 而不是 softCap()：后者可能低于玩家手上兵力，
    // 会算出一个比玩家上限还高的必死敌人。
    const reach = Math.min(par, battleCap());
    let ec = Math.max(5, Math.round(reach * f * swarmMul));
    // 不变量：敌兵永远不能超过"完美玩家抵达时手上的兵力"。
    // 违反这条会让关卡在数学上无解 —— 这是靠调参永远堵不住的窟窿，
    // 必须由规则本身保证。留 8% 余量，让完美玩家能赢但不轻松。
    // 同时再夹一次 battleCap()：cap 诅咒压低上限后 par 仍可能是旧的大值，
    // 只夹 par*0.92 会漏掉这种情况。
    ec = Math.max(5, Math.min(ec, Math.round(par * 0.92), Math.round(battleCap() * 0.9)));
    pending.push({
      type: 'enemy', z: cursor, count: ec, par: reach, round: roundNo,
      triggered: false, crowd: null, sprite: null
    });
    // par 是"预期兵力"，敌兵提前按这个数生成，所以这里必须同步扣减，
    // 否则 par 只增不减 → 敌兵越滚越大 → 完美玩家也必死
    par = Math.max(1, par - ec);
    roundNo++;
    // 进入新关卡：发本关配额。首关就发，让玩家开局 10 秒内撞上取舍。
    setRoundCurseQuota();
    cursor -= ENEMY_GAP;
  } else {
    buildFinish(cursor);
    pending.push({ type: 'finish', z: cursor, done: false });
    cursor -= FINISH_GAP;
  }
}

function updateDirector() {
  while (planIdx < PLAN.length) {
    // 遇到还没打的敌兵就暂停生成，等战斗结算完再继续
    if (pending.some((o) => o.type === 'enemy' && !o.triggered)) break;
    if (!(cursor > state.z - HORIZON)) break;
    spawnNext();
  }
}

/* 一直挂在屏幕上的"当前还背着哪些诅咒"提示条 */
function renderCurseTags() {
  const tags = [];
  if (capMul < 1) tags.push('上限 ' + Math.round(capMul * 100) + '%');
  if (swarmMul > 1) tags.push('敌兵 ×' + swarmMul.toFixed(2));
  if (steerLock > 0) tags.push('转向失灵');
  $('curseTag').innerHTML = tags.map((t) => '<span class="curse-item" style="animation:none">' + t + '</span>').join('');
}

function updateHUD() {
  $('roundLabel').textContent = '第 ' + Math.min(state.round, GATE_COUNTS.length) + ' 关';
  const p = clamp((0 - state.z) / TOTAL_DIST, 0, 1);
  $('progLabel').textContent = Math.round(p * 100) + '%';
}

/* ================= lifecycle ================= */
function resetGame() {
  while (world.children.length) world.remove(world.children[0]);
  world.add(ground, road);
  addRails();

  pending = [];
  planIdx = 0;
  cursor = START_Z;
  par = 1;
  roundNo = 1;
  capMul = 1;
  steerLock = 0;
  swarmMul = 1;
  setRoundCurseQuota();   // 首关就发配额，别把新机制藏到第 2 关之后

  playerCrowd = new Crowd({ body: 0x2f7fe0, body2: 0x1d5fb0, head: 0xffe0b8, dir: -1, spread: 0.38 });
  playerCrowd.base.set(0, 0, 0);

  state.phase = 'ready';
  state.x = 0;
  state.targetX = 0;
  state.z = 0;
  state.speed = 13.5;
  state.round = 1;
  setHudCount(1, false);
  playerCrowd.setCount(1);

  battle.t = 0; battle.clashed = false; battle.enemy = null; battle.result = null;
  shake = 0;
  hitstop = 0;
  timeScale = 1;
  particles.visible = false;
  pT = -1;
  $('popup').innerHTML = '';
  renderCurseTags();

  updateDirector();
  updateHUD();
}

function startGame() {
  $('overlay').classList.add('hidden');
  $('hint').style.opacity = '0.85';
  state.phase = 'run';
  $('audiobar').style.display = 'flex';
  MUSIC.play('run');
  setTimeout(() => { $('hint').style.opacity = '0'; }, 3400);
}

function endGame(win) {
  state.phase = win ? 'win' : 'over';
  MUSIC.play(win ? 'win' : 'over');
  setTimeout(() => { if (state.phase === 'win' || state.phase === 'over') MUSIC.pause(); }, 4200);
  $('ovTitle').textContent = win ? '全线突破' : '全军覆没';
  if (win) {
    $('ovStat').style.display = 'block';
    $('ovStat').textContent = state.count + ' 名小兵抵达终点';
    // 结算里提一句"带着代价走完全程"，让交换门的取舍有回报感
    const scarred = capMul < 1 || swarmMul !== 1;
    $('ovText').innerHTML = scarred
      ? '带着代价走完全程<br><span style="font-size:12px;opacity:.7">橙色的门没白挨</span>'
      : '一路上的每个数字门都没白过';
  } else {
    $('ovStat').style.display = 'none';
    $('ovText').innerHTML = '兵力被吃光了<br>下次记得挑数字大的那扇门<br>' +
      '<span style="font-size:12px;opacity:.7">橙色门虽然大，但代价可能要命</span>';
  }
  $('ovBtn').textContent = '再来一局';
  $('overlay').classList.remove('hidden');
  $('ovBtn').onclick = () => { resetGame(); startGame(); };
}

/* ================= input ================= */
const keys = {};
addEventListener('keydown', (e) => {
  keys[e.code] = true;
  if (['ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  if (e.code === 'KeyM') toggleMusic();
});
addEventListener('keyup', (e) => { keys[e.code] = false; });

/* 切到后台自动静音，回来接着放——网页游戏的基本礼貌 */
document.addEventListener('visibilitychange', () => {
  if (document.hidden) MUSIC.pause();
  else if (MUSIC.enabled && (state.phase === 'run' || state.phase === 'battle')) {
    MUSIC.play(state.phase === 'battle' ? 'fight' : 'run');
  }
});

/* ---------- 音乐控制 ---------- */
function setVolLabel(v) {
  if (!v) return;
  $('volLabel').textContent = String(Math.round(v));
}
function applyMusicUi() {
  $('musicToggle').classList.toggle('muted', !MUSIC.enabled);
  const v = Math.round(MUSIC.volume * 100);
  $('musicVol').value = String(v);
  setVolLabel(v);
}
function toggleMusic() {
  MUSIC.setEnabled(!MUSIC.enabled);
  applyMusicUi();
}
$('musicToggle').onclick = (e) => { e.preventDefault(); toggleMusic(); };
$('musicVol').oninput = (e) => {
  const v = Number(e.target.value) / 100;
  MUSIC.setVolume(v);
  setVolLabel(e.target.value);
  if (v > 0 && !MUSIC.enabled) { MUSIC.setEnabled(true); applyMusicUi(); }
};

let dragging = false, dragStartX = 0, dragStartTarget = 0;
const cv = renderer.domElement;
cv.addEventListener('pointerdown', (e) => {
  dragging = true;
  dragStartX = e.clientX;
  dragStartTarget = state.targetX;
});
addEventListener('pointermove', (e) => {
  if (!dragging) return;
  state.targetX = clamp(dragStartTarget + (e.clientX - dragStartX) / innerWidth * 7.0, -3.35, 3.35);
});
addEventListener('pointerup', () => { dragging = false; });
addEventListener('pointercancel', () => { dragging = false; });

/* ================= gameplay ================= */
function passGate(o) {
  const side = state.x < 0 ? o.left : o.right;
  const before = state.count;
  const after = resolveGate(side, before);
  setHudCount(after, true);
  if (playerCrowd) playerCrowd.setCount(state.count);

  // 交换门的代价在这里落地
  if (side.curse) {
    CURSES[side.curse].apply();
    showPopup(side.curse === 'tax' ? '先扣三成' : CURSES[side.curse].label, false);
    flashScreen(0.34, '#f59e0b');
  } else {
    showPopup(opLabel(side), after >= before);
  }
  par = Math.max(par, state.count);
}

function startBattle(o) {
  state.phase = 'battle';
  MUSIC.play('fight');
  battle.t = 0;
  battle.clashed = false;
  battle.enemy = o;
  battle.result = null;
  battle.startZ = o.z;
  state.round = o.round;

  const crowd = new Crowd({ body: 0xdc2626, body2: 0x991b1b, head: 0xfecaca, dir: 1, spread: 0.44 });
  crowd.base.set(0, 0, o.z);
  crowd.setCount(o.count);
  o.crowd = crowd;

  const sp = makeCountSprite();
  sp.position.set(0, 3.5, o.z);
  world.add(sp);
  drawCountSprite(sp, o.count);
  o.sprite = sp;
}

function doClash() {
  const P = state.count;
  const M = battle.enemy.count;
  const win = P > M;
  const survivors = Math.abs(P - M);
  battle.result = win;
  battle.enemyM = M;
  battle.enemyP = P;

  burst(state.x, 1.1, state.z - 2.0);

  // 撞击的"肉感"三件套：顿帧 + 白闪 + 慢镜头
  // 顿帧 85ms 实测约 5 帧，人眼几乎无感 —— 调高到 170ms 才真正"卡"得住，
  // 慢镜头再往后拖一拍，让撞击那一刻占据明显更长的主观时间。
  hitstop = win ? 0.17 : 0.22;
  flashScreen(win ? 0.8 : 0.95, win ? '#ffffff' : '#ff9b9b');
  timeScale = 0.18;
  shake = win ? 0.55 : 0.8;

  // 敌人被打散的数字碎片：顺手把减员量当作飞溅数值
  if (win) {
    playerCrowd.setCount(survivors);
    battle.enemy.crowd.setCount(0);
    setHudCount(survivors, true);
    showPopup('-' + M, true);
    // par 已经在下发敌兵时扣过 M 了，这里只需跟着玩家的实际兵力走
    par = Math.max(1, state.count);
  } else {
    playerCrowd.setCount(0);
    battle.enemy.crowd.setCount(Math.max(0, M - P));
    setHudCount(0, false);
    showPopup('-' + P, false);
  }
  renderCurseTags();
}

function updateBattle(dt) {
  battle.t += dt;
  const e = battle.enemy;
  const k = Math.min(1, battle.t / 0.75);
  const ease = 1 - Math.pow(1 - k, 3);
  const z = battle.startZ + (state.z - 2.8 - battle.startZ) * ease;
  e.crowd.base.set(0, 0, z);
  if (e.sprite) {
    e.sprite.position.set(0, 3.5, z);
    e.sprite.visible = !battle.clashed;
  }

  if (!battle.clashed && battle.t >= 0.75) {
    battle.clashed = true;
    doClash();
  }

  if (battle.clashed && battle.t >= 1.7) {
    if (battle.result) {
      state.phase = 'run';
      MUSIC.play('run');
      // 打贏一场就回收一点诅咒惩罚，让玩家有机会爬回来
      recoverCaps();
      renderCurseTags();
      if (e.crowd) { e.crowd.dispose(); e.crowd = null; }
      if (e.sprite) { world.remove(e.sprite); e.sprite = null; }
      state.speed = Math.min(19, state.speed + 0.7);
    } else {
      endGame(false);
    }
  }
}

function updateRun(dt) {
  state.z -= state.speed * dt;
  updateDirector();

  for (let i = pending.length - 1; i >= 0; i--) {
    const o = pending[i];

    if (o.type === 'gate' && !o.resolved && state.z <= o.z) {
      o.resolved = true;
      passGate(o);
    } else if (o.type === 'enemy' && !o.triggered && state.z <= o.z + 10) {
      o.triggered = true;
      startBattle(o);
      return;
    } else if (o.type === 'finish' && !o.done && state.z <= o.z) {
      o.done = true;
      endGame(true);
      return;
    }

    if (o.z > state.z + 34 && (o.type !== 'enemy' || o.triggered)) pending.splice(i, 1);
  }
}

function updateGateVisuals(dt) {
  for (const o of pending) {
    if (o.type !== 'gate' || !o.resolved || !o.vis) continue;
    o.vis.fade -= dt * 2.6;
    const f = Math.max(0, o.vis.fade);
    for (const p of o.vis.panels) p.material.opacity = f;
    if (f <= 0 && o.vis.group.parent) world.remove(o.vis.group);
  }
}

/* ================= main loop ================= */
const clock = new THREE.Clock();
let elapsed = 0;

function tick() {
  requestAnimationFrame(tick);
  let dt = Math.min(0.05, clock.getDelta());

  // 顿帧：撞击瞬间把时间完全冻住，然后缓慢恢复成慢镜头
  if (hitstop > 0) {
    hitstop -= dt;
    dt = 0;
  } else if (timeScale < 1) {
    timeScale = Math.min(1, timeScale + dt * 2.6);
    dt *= timeScale;
  }
  elapsed += dt;

  if (state.phase === 'run' || state.phase === 'battle') {
    // 交换门的"下关难控"诅咒：转向大幅变钝
    const steer = steerLock > 0 ? 0.28 : 1;
    if (keys['ArrowLeft'] || keys['KeyA']) state.targetX -= 9 * dt * steer;
    if (keys['ArrowRight'] || keys['KeyD']) state.targetX += 9 * dt * steer;
    state.targetX = clamp(state.targetX, -3.35, 3.35);
    // 迟钝时阻尼也变慢，手感上"拉不动"
    state.x += (state.targetX - state.x) * Math.min(1, dt * (steerLock > 0 ? 4.5 : 16));
    if (steerLock > 0) {
      steerLock -= dt;
      if (steerLock <= 0) { steerLock = 0; renderCurseTags(); }
    }
  }

  if (state.phase === 'run') { updateRun(dt); updateHUD(); }
  else if (state.phase === 'battle') updateBattle(dt);

  updateGateVisuals(dt);

  if (playerCrowd) {
    playerCrowd.base.set(state.x, 0, state.z);
    playerCrowd.update(elapsed, dt);
  }
  for (const o of pending) if (o.type === 'enemy' && o.crowd) o.crowd.update(elapsed, dt);

  if (pT >= 0) {
    pT += dt;
    for (let i = 0; i < P_COUNT; i++) {
      pVel[i * 3 + 1] -= 16 * dt;
      pPos[i * 3] += pVel[i * 3] * dt;
      pPos[i * 3 + 1] += pVel[i * 3 + 1] * dt;
      pPos[i * 3 + 2] += pVel[i * 3 + 2] * dt;
      if (pPos[i * 3 + 1] < 0.05) pPos[i * 3 + 1] = 0.05;
    }
    pGeo.attributes.position.needsUpdate = true;
    pMat.opacity = Math.max(0, 1 - pT / 0.8);
    if (pT > 0.8) { particles.visible = false; pT = -1; }
  }

  if (shake > 0) shake = Math.max(0, shake - dt * 2.2);
  const sh = shake * 0.22;
  camera.position.set(
    state.x * 0.82 + (Math.random() - 0.5) * sh,
    5.4 + (Math.random() - 0.5) * sh,
    state.z + 11
  );
  camera.lookAt(state.x * 0.82, 0.5, state.z - 7);

  renderer.render(scene, camera);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ================= boot ================= */
globalThis.__GAME_HOOK = {
  tick, clock, renderer,
  phase: () => state.phase,
  state,
  get pending() { return pending; },
  applyOp,
  resetGame,
  get playerCrowd() { return playerCrowd; },
  // 打击感相关的实时量，供无头脚本量化"顿帧到底有没有发生"
  get feel() { return { hitstop, timeScale, shake, capMul, swarmMul, steerLock, curseLeft, gatesLeftInRound }; },
  music: MUSIC
};

applyMusicUi();
resetGame();
$('ovBtn').onclick = startGame;
tick();
</script>
</body>
</html>
