top:
  - class_name: card-weather-summary
    id_name: card-weather-summary
    icon: fas fa-cloud-sun-rain
    name: 主要产区气象概述与预测
    html: "<div class=\"weather-summary-widget\" style=\"font-size: 0.84rem; line-height:\
      \ 1.55;\">\n  <div style=\"background: rgba(59, 130, 246, 0.08); border-left:\
      \ 3px solid #3b82f6; border-radius: 4px; padding: 6px 8px; margin-bottom: 8px;\
      \ font-size: 0.80rem; line-height: 1.45;\">\n    <div style=\"display: flex; justify-content:\
      \ space-between; align-items: center; margin-bottom: 2px;\">\n      <strong style=\"\
      color: #2563eb; font-size: 0.81rem;\"><i class=\"fas fa-bullhorn\" style=\"margin-right:\
      \ 4px;\"></i>产区气象物候综述</strong>\n      <span style=\"font-size: 0.70rem; color:\
      \ #64748b; background: rgba(100, 116, 139, 0.1); padding: 1px 5px; border-radius:\
      \ 3px;\">9月中旬 · 旺产季</span>\n    </div>\n    当前全球处于产胶增产高峰。<strong>版纳</strong>晴好干燥利于割胶；<strong>泰南</strong>短时阵雨、早割窗口顺畅；<strong>海南/越南</strong>受季风与对流影响雨日偏多，局地需防范冲胶；<strong>西非</strong>水热适宜产能稳步释放。\n\
      \  </div>\n  <ul style=\"padding-left: 0; list-style: none; margin: 0 0 8px 0;\"\
      >\n    <li style=\"margin-bottom: 6px; border-bottom: 1px dashed rgba(128, 128,\
      \ 128, 0.2); padding-bottom: 5px;\">\n      <div style=\"display: flex; justify-content:\
      \ space-between; align-items: center; margin-bottom: 1px;\">\n        <span><strong>\U0001F1F9\
      \U0001F1ED 泰南核心</strong> <small style=\"color: #64748b; font-size: 0.70rem;\"\
      >(全球33%)</small></span>\n        <span style=\"font-size: 0.68rem; padding: 1px\
      \ 5px; border-radius: 999px; background: rgba(245, 158, 11, 0.12); color: #d97706;\
      \ font-weight: 600;\">局地阵雨</span>\n      </div>\n      <div style=\"font-size:\
      \ 0.74rem; color: #64748b; margin-bottom: 1px;\">\n        <span>7天累积: <b style=\"\
      color: #2563eb;\">45.9mm</b></span> · <span>扰动: <b>3天</b></span> · <span>24~33°C</span>\n\
      \      </div>\n      <div style=\"font-size: 0.77rem; color: inherit; opacity:\
      \ 0.88; line-height: 1.35;\">\n        降水多在傍晚热对流，凌晨早割窗口通畅，增产顺畅。\n      </div>\n\
      \    </li>\n    <li style=\"margin-bottom: 6px; border-bottom: 1px dashed rgba(128,\
      \ 128, 128, 0.2); padding-bottom: 5px;\">\n      <div style=\"display: flex; justify-content:\
      \ space-between; align-items: center; margin-bottom: 1px;\">\n        <span><strong>\U0001F1E8\
      \U0001F1F3 云南版纳</strong> <small style=\"color: #64748b; font-size: 0.70rem;\"\
      >(国内主力)</small></span>\n        <span style=\"font-size: 0.68rem; padding: 1px\
      \ 5px; border-radius: 999px; background: rgba(16, 185, 129, 0.12); color: #059669;\
      \ font-weight: 600;\">晴好少雨</span>\n      </div>\n      <div style=\"font-size:\
      \ 0.74rem; color: #64748b; margin-bottom: 1px;\">\n        <span>7天累积: <b style=\"\
      color: #059669;\">4.6mm</b></span> · <span>扰动: <b>0天</b></span> · <span>19~32°C</span>\n\
      \      </div>\n      <div style=\"font-size: 0.77rem; color: inherit; opacity:\
      \ 0.88; line-height: 1.35;\">\n        干燥少雨且温差适宜，出胶干含双优，开割条件极佳。\n      </div>\n\
      \    </li>\n    <li style=\"margin-bottom: 6px; border-bottom: 1px dashed rgba(128,\
      \ 128, 128, 0.2); padding-bottom: 5px;\">\n      <div style=\"display: flex; justify-content:\
      \ space-between; align-items: center; margin-bottom: 1px;\">\n        <span><strong>\U0001F1E8\
      \U0001F1F3 海南主产</strong> <small style=\"color: #64748b; font-size: 0.70rem;\"\
      >(国内核心)</small></span>\n        <span style=\"font-size: 0.68rem; padding: 1px\
      \ 5px; border-radius: 999px; background: rgba(59, 130, 246, 0.12); color: #2563eb;\
      \ font-weight: 600;\">对流偏强</span>\n      </div>\n      <div style=\"font-size:\
      \ 0.74rem; color: #64748b; margin-bottom: 1px;\">\n        <span>7天累积: <b style=\"\
      color: #2563eb;\">117.9mm</b></span> · <span>扰动: <b>5天</b></span> · <span>22~31°C</span>\n\
      \      </div>\n      <div style=\"font-size: 0.77rem; color: inherit; opacity:\
      \ 0.88; line-height: 1.35;\">\n        南海热带扰动频繁，中后期雷雨密，需重点防范雨冲胶。\n      </div>\n\
      \    </li>\n    <li style=\"margin-bottom: 6px; border-bottom: 1px dashed rgba(128,\
      \ 128, 128, 0.2); padding-bottom: 5px;\">\n      <div style=\"display: flex; justify-content:\
      \ space-between; align-items: center; margin-bottom: 1px;\">\n        <span><strong>\U0001F1FB\
      \U0001F1F3 越南南部</strong> <small style=\"color: #64748b; font-size: 0.70rem;\"\
      >(平福/同奈)</small></span>\n        <span style=\"font-size: 0.68rem; padding: 1px\
      \ 5px; border-radius: 999px; background: rgba(139, 92, 246, 0.12); color: #7c3aed;\
      \ font-weight: 600;\">季风雨盛</span>\n      </div>\n      <div style=\"font-size:\
      \ 0.74rem; color: #64748b; margin-bottom: 1px;\">\n        <span>7天累积: <b style=\"\
      color: #7c3aed;\">121.8mm</b></span> · <span>扰动: <b>6天</b></span> · <span>23~31°C</span>\n\
      \      </div>\n      <div style=\"font-size: 0.77rem; color: inherit; opacity:\
      \ 0.88; line-height: 1.35;\">\n        季风雨量充沛，早间对流频繁，局部割胶进度阶段性受阻。\n      </div>\n\
      \    </li>\n    <li style=\"margin-bottom: 6px; border-bottom: 1px dashed rgba(128,\
      \ 128, 128, 0.2); padding-bottom: 5px;\">\n      <div style=\"display: flex; justify-content:\
      \ space-between; align-items: center; margin-bottom: 1px;\">\n        <span><strong>\U0001F1EE\
      \U0001F1E9 印尼苏岛</strong> <small style=\"color: #64748b; font-size: 0.70rem;\"\
      >(棉兰/巨港)</small></span>\n        <span style=\"font-size: 0.68rem; padding: 1px\
      \ 5px; border-radius: 999px; background: rgba(6, 182, 212, 0.12); color: #0891b2;\
      \ font-weight: 600;\">常态雷雨</span>\n      </div>\n      <div style=\"font-size:\
      \ 0.74rem; color: #64748b; margin-bottom: 1px;\">\n        <span>7天累积: <b style=\"\
      color: #0891b2;\">135.4mm</b></span> · <span>扰动: <b>6天</b></span> · <span>23~32°C</span>\n\
      \      </div>\n      <div style=\"font-size: 0.77rem; color: inherit; opacity:\
      \ 0.88; line-height: 1.35;\">\n        赤道对流常态活跃，多为午后雷雨，错峰收胶生产平稳。\n      </div>\n\
      \    </li>\n    <li style=\"margin-bottom: 4px;\">\n      <div style=\"display:\
      \ flex; justify-content: space-between; align-items: center; margin-bottom: 1px;\"\
      >\n        <span><strong>\U0001F1E8\U0001F1EE 西非科特</strong> <small style=\"color:\
      \ #64748b; font-size: 0.70rem;\">(阿比让)</small></span>\n        <span style=\"\
      font-size: 0.68rem; padding: 1px 5px; border-radius: 999px; background: rgba(16,\
      \ 185, 129, 0.12); color: #059669; font-weight: 600;\">水热均衡</span>\n      </div>\n\
      \      <div style=\"font-size: 0.74rem; color: #64748b; margin-bottom: 1px;\"\
      >\n        <span>7天累积: <b style=\"color: #059669;\">41.7mm</b></span> · <span>扰动:\
      \ <b>3天</b></span> · <span>23~28°C</span>\n      </div>\n      <div style=\"font-size:\
      \ 0.77rem; color: inherit; opacity: 0.88; line-height: 1.35;\">\n        降雨温和绵密，新割胶林产能持续释放，供应增量稳定。\n\
      \      </div>\n    </li>\n  </ul>\n  <div style=\"display: flex; justify-content:\
      \ space-between; align-items: center; margin-top: 6px; padding-top: 5px; border-top:\
      \ 1px solid rgba(128, 128, 128, 0.15); font-size: 0.76rem;\">\n    <div style=\"\
      display: flex; gap: 6px;\">\n      <a href=\"/tools/rubber-weather-calendar/\"\
      \ style=\"color: #059669; text-decoration: none; font-weight: 500;\" title=\"\
      产区气象与割胶物候看板\"><i class=\"fas fa-calendar-alt\"></i> 物候看板</a>\n      <a href=\"\
      /rubber/weather_forecast/\" style=\"color: #3b82f6; text-decoration: none; font-weight:\
      \ 500;\" title=\"重点资源区域卫星云图观察\"><i class=\"fas fa-satellite\"></i> 卫星云图</a>\n\
      \    </div>\n    <a href=\"/2026/09/10/全球主要橡胶及大宗农产区天气概述与割胶物候预测（2026年9月中旬）/\" style=\"\
      color: #2563eb; font-weight: 600; text-decoration: none;\">完整研报 →</a>\n  </div>\n\
      </div>\n"

  - class_name: card-hot-news
    id_name: card-hot-news
    icon: fas fa-globe-asia
    name: 时政与大宗速览
    html: |
      <div class="news-list" style="font-size: 0.88rem; line-height: 1.6;">
        <ul style="padding-left: 0; list-style: none; margin: 0 0 8px 0;">
          <li style="margin-bottom: 7px; border-bottom: 1px dashed rgba(128, 128, 128, 0.2); padding-bottom: 5px;">
            <span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:#ef4444;margin-right:6px;vertical-align:middle;"></span>
            <a href="/2026/10/10/%E7%BE%8E%E5%88%B6%E8%A3%81%E4%BC%8A%E6%9C%97%E5%BD%B1%E5%AD%90%E8%88%B9%E9%98%9F%EF%BC%9A%E5%85%A8%E7%90%83%E6%97%B6%E6%94%BF%E4%B8%8E%E5%A4%A7%E5%AE%97%E5%95%86%E5%93%81%E8%A6%81%E7%82%B9%E9%80%9F%E8%A7%88%EF%BC%882026%E5%B9%B410%E6%9C%8810%E6%97%A5%EF%BC%89/" style="color: inherit; text-decoration: none;" title="美国财政部宣布制裁17艘与伊朗影子舰队相关的船只，旨在切断伊朗石油出口渠道，加剧中东地缘政治紧张局势。">美制裁17艘伊朗影子船队</a>
          </li>
          <li style="margin-bottom: 7px; border-bottom: 1px dashed rgba(128, 128, 128, 0.2); padding-bottom: 5px;">
            <span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:#f59e0b;margin-right:6px;vertical-align:middle;"></span>
            <a href="/2026/10/10/%E7%BE%8E%E5%88%B6%E8%A3%81%E4%BC%8A%E6%9C%97%E5%BD%B1%E5%AD%90%E8%88%B9%E9%98%9F%EF%BC%9A%E5%85%A8%E7%90%83%E6%97%B6%E6%94%BF%E4%B8%8E%E5%A4%A7%E5%AE%97%E5%95%86%E5%93%81%E8%A6%81%E7%82%B9%E9%80%9F%E8%A7%88%EF%BC%882026%E5%B9%B410%E6%9C%8810%E6%97%A5%EF%BC%89/" style="color: inherit; text-decoration: none;" title="霍尔木兹海峡油轮遇袭事件激增，通行量降至两个月低点，战争险费率飙升，原油供应风险溢价显著抬升。">霍尔木兹海峡油轮遇袭频发</a>
          </li>
          <li style="margin-bottom: 7px; border-bottom: 1px dashed rgba(128, 128, 128, 0.2); padding-bottom: 5px;">
            <span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:#3b82f6;margin-right:6px;vertical-align:middle;"></span>
            <a href="/2026/10/10/%E7%BE%8E%E5%88%B6%E8%A3%81%E4%BC%8A%E6%9C%97%E5%BD%B1%E5%AD%90%E8%88%B9%E9%98%9F%EF%BC%9A%E5%85%A8%E7%90%83%E6%97%B6%E6%94%BF%E4%B8%8E%E5%A4%A7%E5%AE%97%E5%95%86%E5%93%81%E8%A6%81%E7%82%B9%E9%80%9F%E8%A7%88%EF%BC%882026%E5%B9%B410%E6%9C%8810%E6%97%A5%EF%BC%89/" style="color: inherit; text-decoration: none;" title="美联储与欧洲央行最新会议纪要显示，尽管加息押注有所降温，但决策层对通胀粘性的担忧依然强烈，紧缩政策基调未变。">美联储纪要显示通胀担忧升温</a>
          </li>
          <li style="margin-bottom: 7px; border-bottom: 1px dashed rgba(128, 128, 128, 0.2); padding-bottom: 5px;">
            <span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:#10b981;margin-right:6px;vertical-align:middle;"></span>
            <a href="/2026/10/10/%E7%BE%8E%E5%88%B6%E8%A3%81%E4%BC%8A%E6%9C%97%E5%BD%B1%E5%AD%90%E8%88%B9%E9%98%9F%EF%BC%9A%E5%85%A8%E7%90%83%E6%97%B6%E6%94%BF%E4%B8%8E%E5%A4%A7%E5%AE%97%E5%95%86%E5%93%81%E8%A6%81%E7%82%B9%E9%80%9F%E8%A7%88%EF%BC%882026%E5%B9%B410%E6%9C%8810%E6%97%A5%EF%BC%89/" style="color: inherit; text-decoration: none;" title="印度央行（RBI）宣布将主要回购利率上调25个基点至5.50%，为2023年2月以来首次加息，标志着此前宽松周期的终结。">RBI意外加息25基点至5.50%</a>
          </li>
          <li style="margin-bottom: 7px; border-bottom: 1px dashed rgba(128, 128, 128, 0.2); padding-bottom: 5px;">
            <span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:#8b5cf6;margin-right:6px;vertical-align:middle;"></span>
            <a href="/2026/10/10/%E7%BE%8E%E5%88%B6%E8%A3%81%E4%BC%8A%E6%9C%97%E5%BD%B1%E5%AD%90%E8%88%B9%E9%98%9F%EF%BC%9A%E5%85%A8%E7%90%83%E6%97%B6%E6%94%BF%E4%B8%8E%E5%A4%A7%E5%AE%97%E5%95%86%E5%93%81%E8%A6%81%E7%82%B9%E9%80%9F%E8%A7%88%EF%BC%882026%E5%B9%B410%E6%9C%8810%E6%97%A5%EF%BC%89/" style="color: inherit; text-decoration: none;" title="泰国持续强降雨影响天然橡胶供应，叠加中国轮胎出口同比增长4.8%，实物需求强劲，支撑胶价底部反弹。">天然橡胶受降雨及需求支撑</a>
          </li>
          <li style="margin-bottom: 7px; border-bottom: 1px dashed rgba(128, 128, 128, 0.2); padding-bottom: 5px;">
            <span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:#ec4899;margin-right:6px;vertical-align:middle;"></span>
            <a href="/2026/10/10/%E7%BE%8E%E5%88%B6%E8%A3%81%E4%BC%8A%E6%9C%97%E5%BD%B1%E5%AD%90%E8%88%B9%E9%98%9F%EF%BC%9A%E5%85%A8%E7%90%83%E6%97%B6%E6%94%BF%E4%B8%8E%E5%A4%A7%E5%AE%97%E5%95%86%E5%93%81%E8%A6%81%E7%82%B9%E9%80%9F%E8%A7%88%EF%BC%882026%E5%B9%B410%E6%9C%8810%E6%97%A5%EF%BC%89/" style="color: inherit; text-decoration: none;" title="胡塞武装袭击利雅得机场，导致114个航班延误、20个取消，显示中东地区冲突外溢风险加剧，影响区域航空与物流。">胡塞武装袭击利雅得机场航班</a>
          </li>
          <li style="margin-top: 6px; padding-top: 6px; border-top: 1px dashed rgba(128, 128, 128, 0.35);">
            <span style="display:inline-block;margin-right:5px;vertical-align:middle;">&#9875;</span>
            <span style="opacity: 0.65; margin-right: 4px;">专题</span>
            <a href="/2026/10/10/%E7%BE%8E%E5%88%B6%E8%A3%81%E4%BC%8A%E6%9C%97%E5%BD%B1%E5%AD%90%E8%88%B9%E9%98%9F%EF%BC%9A%E5%85%A8%E7%90%83%E6%97%B6%E6%94%BF%E4%B8%8E%E5%A4%A7%E5%AE%97%E5%95%86%E5%93%81%E8%A6%81%E7%82%B9%E9%80%9F%E8%A7%88%EF%BC%882026%E5%B9%B410%E6%9C%8810%E6%97%A5%EF%BC%89/" style="color: inherit; text-decoration: none;" title="截至10月9日，受油轮遇袭频发影响，霍尔木兹海峡通行量降至两个月低点，战争险费率大幅上涨，原油供应风险溢价显著抬升。">霍尔木兹海峡通行量降至两月低点</a>
          </li>
        </ul>
        <div style="text-align: right; margin-top: 4px;">
          <a href="/2026/10/10/%E7%BE%8E%E5%88%B6%E8%A3%81%E4%BC%8A%E6%9C%97%E5%BD%B1%E5%AD%90%E8%88%B9%E9%98%9F%EF%BC%9A%E5%85%A8%E7%90%83%E6%97%B6%E6%94%BF%E4%B8%8E%E5%A4%A7%E5%AE%97%E5%95%86%E5%93%81%E8%A6%81%E7%82%B9%E9%80%9F%E8%A7%88%EF%BC%882026%E5%B9%B410%E6%9C%8810%E6%97%A5%EF%BC%89/" style="font-size: 0.82rem; color: #3b82f6; font-weight: 500; text-decoration: none;">完整速览与推演 →</a>
        </div>
      </div>
  - class_name: card-ai-news
    id_name: card-ai-news
    icon: fas fa-robot
    name: AI 科技前沿大事
    html: |
      <div class="news-list" style="font-size: 0.88rem; line-height: 1.6;">
        <ul style="padding-left: 0; list-style: none; margin: 0 0 8px 0;">
          <li style="margin-bottom: 7px; border-bottom: 1px dashed rgba(128, 128, 128, 0.2); padding-bottom: 5px;">
            <span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:#8b5cf6;margin-right:6px;vertical-align:middle;"></span>
            <a href="/2026/10/10/%E5%BE%AE%E8%BD%AF%E5%8F%91%E5%B8%83MAI-Code%E4%B8%8E%E5%86%B3%E7%AD%96%E6%A8%A1%E5%9E%8B%EF%BC%9A%E5%85%A8%E7%90%83AI%E5%89%8D%E6%B2%BF%E5%A4%A7%E4%BA%8B%E9%80%9F%E8%A7%88%EF%BC%882026%E5%B9%B410%E6%9C%8810%E6%97%A5%EF%BC%89/" style="color: inherit; text-decoration: none;" title="微软发布137B参数MAI-Code-1.1 Flash及Microsoft-Decision-1，主打端侧安全智能体与极速结构化决策">微软发布MAI-Code与Decision-1模型</a>
          </li>
          <li style="margin-bottom: 7px; border-bottom: 1px dashed rgba(128, 128, 128, 0.2); padding-bottom: 5px;">
            <span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:#06b6d4;margin-right:6px;vertical-align:middle;"></span>
            <a href="/2026/10/10/%E5%BE%AE%E8%BD%AF%E5%8F%91%E5%B8%83MAI-Code%E4%B8%8E%E5%86%B3%E7%AD%96%E6%A8%A1%E5%9E%8B%EF%BC%9A%E5%85%A8%E7%90%83AI%E5%89%8D%E6%B2%BF%E5%A4%A7%E4%BA%8B%E9%80%9F%E8%A7%88%EF%BC%882026%E5%B9%B410%E6%9C%8810%E6%97%A5%EF%BC%89/" style="color: inherit; text-decoration: none;" title="OpenAI GPT-6推出Intelligent UI，支持文本、视觉与交互元素动态组合，重塑多模态交互体验">OpenAI GPT-6引入Intelligent UI</a>
