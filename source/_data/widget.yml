          <li style="margin-bottom: 7px; border-bottom: 1px dashed rgba(128, 128, 128, 0.2); padding-bottom: 5px;">
            <span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:#f59e0b;margin-right:6px;vertical-align:middle;"></span>
            <a href="/2026/10/08/%E9%98%BF%E6%8B%89%E4%BC%AF%E6%B9%BE%E6%B2%B9%E8%BD%AE%E9%81%87%E8%A2%AD%E8%87%B4%E4%BC%A4%E4%BA%A1%EF%BC%9A%E5%85%A8%E7%90%83%E6%97%B6%E6%94%BF%E4%B8%8E%E5%A4%A7%E5%AE%97%E5%95%86%E5%93%81%E8%A6%81%E7%82%B9%E9%80%9F%E8%A7%88%EF%BC%882026%E5%B9%B410%E6%9C%8808%E6%97%A5%EF%BC%89/" style="color: inherit; text-decoration: none;" title="美联储9月16日加息25bp至3.75-4.00%，为2023年来首次加息，10月FOMC纪要将揭示后续紧缩路径。">美联储9月加息至3.75-4.00%</a>
          </li>
          <li style="margin-bottom: 7px; border-bottom: 1px dashed rgba(128, 128, 128, 0.2); padding-bottom: 5px;">
            <span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:#3b82f6;margin-right:6px;vertical-align:middle;"></span>
            <a href="/2026/10/08/%E9%98%BF%E6%8B%89%E4%BC%AF%E6%B9%BE%E6%B2%B9%E8%BD%AE%E9%81%87%E8%A2%AD%E8%87%B4%E4%BC%A4%E4%BA%A1%EF%BC%9A%E5%85%A8%E7%90%83%E6%97%B6%E6%94%BF%E4%B8%8E%E5%A4%A7%E5%AE%97%E5%95%86%E5%93%81%E8%A6%81%E7%82%B9%E9%80%9F%E8%A7%88%EF%BC%882026%E5%B9%B410%E6%9C%8808%E6%97%A5%EF%BC%89/" style="color: inherit; text-decoration: none;" title="印度央行RBI将回购利率上调25bp至5.50%，为2023年2月以来首次加息，终结此前100bp的宽松周期。">RBI加息25bp至5.50%终结宽松</a>
          </li>
          <li style="margin-bottom: 7px; border-bottom: 1px dashed rgba(128, 128, 128, 0.2); padding-bottom: 5px;">
            <span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:#10b981;margin-right:6px;vertical-align:middle;"></span>
            <a href="/2026/10/08/%E9%98%BF%E6%8B%89%E4%BC%AF%E6%B9%BE%E6%B2%B9%E8%BD%AE%E9%81%87%E8%A2%AD%E8%87%B4%E4%BC%A4%E4%BA%A1%EF%BC%9A%E5%85%A8%E7%90%83%E6%97%B6%E6%94%BF%E4%B8%8E%E5%A4%A7%E5%AE%97%E5%95%86%E5%93%81%E8%A6%81%E7%82%B9%E9%80%9F%E8%A7%88%EF%BC%882026%E5%B9%B410%E6%9C%8808%E6%97%A5%EF%BC%89/" style="color: inherit; text-decoration: none;" title="黄金价格受地缘避险与通胀压力双重驱动，Comex金价维持在4200美元上方，白银同步走强。">黄金受避险与通胀双重驱动</a>
          </li>
          <li style="margin-bottom: 7px; border-bottom: 1px dashed rgba(128, 128, 128, 0.2); padding-bottom: 5px;">
            <span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:#8b5cf6;margin-right:6px;vertical-align:middle;"></span>
            <a href="/2026/10/08/%E9%98%BF%E6%8B%89%E4%BC%AF%E6%B9%BE%E6%B2%B9%E8%BD%AE%E9%81%87%E8%A2%AD%E8%87%B4%E4%BC%A4%E4%BA%A1%EF%BC%9A%E5%85%A8%E7%90%83%E6%97%B6%E6%94%BF%E4%B8%8E%E5%A4%A7%E5%AE%97%E5%95%86%E5%93%81%E8%A6%81%E7%82%B9%E9%80%9F%E8%A7%88%EF%BC%882026%E5%B9%B410%E6%9C%8808%E6%97%A5%EF%BC%89/" style="color: inherit; text-decoration: none;" title="原油价格因霍尔木兹海峡供应中断担忧反弹，Brent原油突破100美元，沙特远东贴水扩大。">原油因供应中断担忧反弹</a>
          </li>
          <li style="margin-bottom: 7px; border-bottom: 1px dashed rgba(128, 128, 128, 0.2); padding-bottom: 5px;">
            <span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:#ec4899;margin-right:6px;vertical-align:middle;"></span>
            <a href="/2026/10/08/%E9%98%BF%E6%8B%89%E4%BC%AF%E6%B9%BE%E6%B2%B9%E8%BD%AE%E9%81%87%E8%A2%AD%E8%87%B4%E4%BC%A4%E4%BA%A1%EF%BC%9A%E5%85%A8%E7%90%83%E6%97%B6%E6%94%BF%E4%B8%8E%E5%A4%A7%E5%AE%97%E5%95%86%E5%93%81%E8%A6%81%E7%82%B9%E9%80%9F%E8%A7%88%EF%BC%882026%E5%B9%B410%E6%9C%8808%E6%97%A5%EF%BC%89/" style="color: inherit; text-decoration: none;" title="工业金属受高利率与需求疲软压制，铜价回落至5.63美元/磅，铝价下跌1.21%至3314美元/吨。">工业金属受高利率压制</a>
          </li>
          <li style="margin-top: 6px; padding-top: 6px; border-top: 1px dashed rgba(128, 128, 128, 0.35);">
            <span style="display:inline-block;margin-right:5px;vertical-align:middle;">&#9875;</span>
            <span style="opacity: 0.65; margin-right: 4px;">专题</span>
            <a href="/2026/10/08/%E9%98%BF%E6%8B%89%E4%BC%AF%E6%B9%BE%E6%B2%B9%E8%BD%AE%E9%81%87%E8%A2%AD%E8%87%B4%E4%BC%A4%E4%BA%A1%EF%BC%9A%E5%85%A8%E7%90%83%E6%97%B6%E6%94%BF%E4%B8%8E%E5%A4%A7%E5%AE%97%E5%95%86%E5%93%81%E8%A6%81%E7%82%B9%E9%80%9F%E8%A7%88%EF%BC%882026%E5%B9%B410%E6%9C%8808%E6%97%A5%EF%BC%89/" style="color: inherit; text-decoration: none;" title="阿拉伯湾油轮遭多次袭击致11名印度船员重伤，霍尔木兹海峡通行风险骤升，推升原油地缘溢价与战争险费率。">阿拉伯湾油轮遇袭致11人重伤</a>
          </li>
        </ul>
        <div style="text-align: right; margin-top: 4px;">
          <a href="/2026/10/08/%E9%98%BF%E6%8B%89%E4%BC%AF%E6%B9%BE%E6%B2%B9%E8%BD%AE%E9%81%87%E8%A2%AD%E8%87%B4%E4%BC%A4%E4%BA%A1%EF%BC%9A%E5%85%A8%E7%90%83%E6%97%B6%E6%94%BF%E4%B8%8E%E5%A4%A7%E5%AE%97%E5%95%86%E5%93%81%E8%A6%81%E7%82%B9%E9%80%9F%E8%A7%88%EF%BC%882026%E5%B9%B410%E6%9C%8808%E6%97%A5%EF%BC%89/" style="font-size: 0.82rem; color: #3b82f6; font-weight: 500; text-decoration: none;">完整速览与推演 →</a>
        </div>
      </div>
  - class_name: card-ai-news
    id_name: card-ai-news
    icon: fas fa-robot
    name: AI 科技前沿大事
    html: |
      <div class="news-list" style="font-size: 0.88rem; line-height: 1.6;">
        <ul style="padding-left: 0; list-style: none; margin: 0 0 8px 0;">
          <li style="margin-bottom: 7px; border-bottom: 1px dashed rgba(128, 128, 128, 0.2); padding-bottom: 5px;">
            <span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:#8b5cf6;margin-right:6px;vertical-align:middle;"></span>
            <a href="/2026/10/08/Mistral%E5%8F%91%E5%B8%83Robostral%E5%AF%BC%E8%88%AA%E6%A8%A1%E5%9E%8B%EF%BC%9A%E5%85%A8%E7%90%83AI%E5%89%8D%E6%B2%BF%E5%A4%A7%E4%BA%8B%E9%80%9F%E8%A7%88%EF%BC%882026%E5%B9%B410%E6%9C%8808%E6%97%A5%EF%BC%89/" style="color: inherit; text-decoration: none;" title="Mistral AI发布80亿参数导航模型Robostral Navigate，支持单RGB相机指令跟随，无需LiDAR或深度传感器">Mistral发布Robostral导航模型</a>
          </li>
          <li style="margin-bottom: 7px; border-bottom: 1px dashed rgba(128, 128, 128, 0.2); padding-bottom: 5px;">
            <span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:#06b6d4;margin-right:6px;vertical-align:middle;"></span>
            <a href="/2026/10/08/Mistral%E5%8F%91%E5%B8%83Robostral%E5%AF%BC%E8%88%AA%E6%A8%A1%E5%9E%8B%EF%BC%9A%E5%85%A8%E7%90%83AI%E5%89%8D%E6%B2%BF%E5%A4%A7%E4%BA%8B%E9%80%9F%E8%A7%88%EF%BC%882026%E5%B9%B410%E6%9C%8808%E6%97%A5%EF%BC%89/" style="color: inherit; text-decoration: none;" title="机器人AI开发商FieldAI Inc.据报寻求7亿美元新融资，专攻机器人专用AI模型研发">FieldAI寻求7亿美元融资</a>
          </li>
