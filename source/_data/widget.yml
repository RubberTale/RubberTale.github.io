        <div style="text-align: right; margin-top: 4px;">
          <a href="/2026/09/11/地缘烽火与商品重定价：全球时政与大宗商品要点速览（2026年09月11日）/" style="font-size: 0.82rem; color: #3b82f6; font-weight: 500; text-decoration: none;">完整速览与推演 →</a>
