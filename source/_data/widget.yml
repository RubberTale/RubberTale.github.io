          <li style="margin-bottom: 7px; border-bottom: 1px dashed rgba(128, 128, 128, 0.2); padding-bottom: 5px;">
            <span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:#3b82f6;margin-right:6px;vertical-align:middle;"></span>
            <a href="/2026/09/24/%E7%89%B9%E6%9C%97%E6%99%AE%E8%81%94%E5%A4%A7%E6%BC%94%E8%AE%B2%E5%A8%81%E8%83%81%E4%BC%8A%E6%9C%97%EF%BC%9A%E5%85%A8%E7%90%83%E6%97%B6%E6%94%BF%E4%B8%8E%E5%A4%A7%E5%AE%97%E5%95%86%E5%93%81%E8%A6%81%E7%82%B9%E9%80%9F%E8%A7%88%EF%BC%882026%E5%B9%B409%E6%9C%8824%E6%97%A5%EF%BC%89/" style="color: inherit; text-decoration: none;" title="WTI在90-100美元区间震荡，BofA警告供应进一步收紧可能推高油价至150美元。">原油价格波动维持高位</a>
          </li>
          <li style="margin-bottom: 7px; border-bottom: 1px dashed rgba(128, 128, 128, 0.2); padding-bottom: 5px;">
            <span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:#10b981;margin-right:6px;vertical-align:middle;"></span>
            <a href="/2026/09/24/%E7%89%B9%E6%9C%97%E6%99%AE%E8%81%94%E5%A4%A7%E6%BC%94%E8%AE%B2%E5%A8%81%E8%83%81%E4%BC%8A%E6%9C%97%EF%BC%9A%E5%85%A8%E7%90%83%E6%97%B6%E6%94%BF%E4%B8%8E%E5%A4%A7%E5%AE%97%E5%95%86%E5%93%81%E8%A6%81%E7%82%B9%E9%80%9F%E8%A7%88%EF%BC%882026%E5%B9%B409%E6%9C%8824%E6%97%A5%EF%BC%89/" style="color: inherit; text-decoration: none;" title="中国通过伦敦OTC市场大规模购金，为金价在美债收益率高企环境下提供底部支撑。">中国6月增持黄金40吨</a>
          </li>
          <li style="margin-bottom: 7px; border-bottom: 1px dashed rgba(128, 128, 128, 0.2); padding-bottom: 5px;">
            <span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:#8b5cf6;margin-right:6px;vertical-align:middle;"></span>
            <a href="/2026/09/24/%E7%89%B9%E6%9C%97%E6%99%AE%E8%81%94%E5%A4%A7%E6%BC%94%E8%AE%B2%E5%A8%81%E8%83%81%E4%BC%8A%E6%9C%97%EF%BC%9A%E5%85%A8%E7%90%83%E6%97%B6%E6%94%BF%E4%B8%8E%E5%A4%A7%E5%AE%97%E5%95%86%E5%93%81%E8%A6%81%E7%82%B9%E9%80%9F%E8%A7%88%EF%BC%882026%E5%B9%B409%E6%9C%8824%E6%97%A5%EF%BC%89/" style="color: inherit; text-decoration: none;" title="上海铜库存创三年新低，抵消关税抛盘压力，铜价单日上涨2.72%。">铜价反弹上海库存触底</a>
          </li>
          <li style="margin-bottom: 7px; border-bottom: 1px dashed rgba(128, 128, 128, 0.2); padding-bottom: 5px;">
            <span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:#ec4899;margin-right:6px;vertical-align:middle;"></span>
            <a href="/2026/09/24/%E7%89%B9%E6%9C%97%E6%99%AE%E8%81%94%E5%A4%A7%E6%BC%94%E8%AE%B2%E5%A8%81%E8%83%81%E4%BC%8A%E6%9C%97%EF%BC%9A%E5%85%A8%E7%90%83%E6%97%B6%E6%94%BF%E4%B8%8E%E5%A4%A7%E5%AE%97%E5%95%86%E5%93%81%E8%A6%81%E7%82%B9%E9%80%9F%E8%A7%88%EF%BC%882026%E5%B9%B409%E6%9C%8824%E6%97%A5%EF%BC%89/" style="color: inherit; text-decoration: none;" title="市场高度关注周四特朗普与习近平的会晤，预计将影响原油流动性与农产品贸易。">美中首脑会晤在即</a>
          </li>
          <li style="margin-top: 6px; padding-top: 6px; border-top: 1px dashed rgba(128, 128, 128, 0.35);">
            <span style="display:inline-block;margin-right:5px;vertical-align:middle;">&#9875;</span>
            <span style="opacity: 0.65; margin-right: 4px;">专题</span>
            <a href="/2026/09/24/%E7%89%B9%E6%9C%97%E6%99%AE%E8%81%94%E5%A4%A7%E6%BC%94%E8%AE%B2%E5%A8%81%E8%83%81%E4%BC%8A%E6%9C%97%EF%BC%9A%E5%85%A8%E7%90%83%E6%97%B6%E6%94%BF%E4%B8%8E%E5%A4%A7%E5%AE%97%E5%95%86%E5%93%81%E8%A6%81%E7%82%B9%E9%80%9F%E8%A7%88%EF%BC%882026%E5%B9%B409%E6%9C%8824%E6%97%A5%EF%BC%89/" style="color: inherit; text-decoration: none;" title="9月23日伊朗袭击沙特Bahri运营的Sidr号油轮，导致联合国暂停撤离行动，加剧航运风险溢价。">伊朗袭击沙特油轮Sidr号</a>
          </li>
        </ul>
        <div style="text-align: right; margin-top: 4px;">
          <a href="/2026/09/24/%E7%89%B9%E6%9C%97%E6%99%AE%E8%81%94%E5%A4%A7%E6%BC%94%E8%AE%B2%E5%A8%81%E8%83%81%E4%BC%8A%E6%9C%97%EF%BC%9A%E5%85%A8%E7%90%83%E6%97%B6%E6%94%BF%E4%B8%8E%E5%A4%A7%E5%AE%97%E5%95%86%E5%93%81%E8%A6%81%E7%82%B9%E9%80%9F%E8%A7%88%EF%BC%882026%E5%B9%B409%E6%9C%8824%E6%97%A5%EF%BC%89/" style="font-size: 0.82rem; color: #3b82f6; font-weight: 500; text-decoration: none;">完整速览与推演 →</a>
