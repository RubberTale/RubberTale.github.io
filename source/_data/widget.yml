          <li style="margin-bottom: 7px; border-bottom: 1px dashed rgba(128, 128, 128, 0.2); padding-bottom: 5px;">
            <span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:#f59e0b;margin-right:6px;vertical-align:middle;"></span>
            <a href="/2026/09/24/%E7%89%B9%E6%9C%97%E6%99%AE%E8%81%94%E5%A4%A7%E6%BC%94%E8%AE%B2%E5%A8%81%E8%83%81%E4%BC%8A%E6%9C%97%EF%BC%9A%E5%85%A8%E7%90%83%E6%97%B6%E6%94%BF%E4%B8%8E%E5%A4%A7%E5%AE%97%E5%95%86%E5%93%81%E8%A6%81%E7%82%B9%E9%80%9F%E8%A7%88%EF%BC%882026%E5%B9%B409%E6%9C%8824%E6%97%A5%EF%BC%89/" style="color: inherit; text-decoration: none;" title="9月16日美联储将利率上调至3.75%-4%，旨在对抗由中东战争引发的全球通胀。">美联储全票加息25基点</a>
