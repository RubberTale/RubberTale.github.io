  - class_name: card-ai-news
    id_name: card-ai-news
    icon: fas fa-robot
    name: AI 科技前沿大事
    html: |
      <div class="news-list" style="font-size: 0.88rem; line-height: 1.6;">
        <ul style="padding-left: 0; list-style: none; margin: 0 0 8px 0;">
          <li style="margin-bottom: 7px; border-bottom: 1px dashed rgba(128, 128, 128, 0.2); padding-bottom: 5px;">
            <span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:#8b5cf6;margin-right:6px;vertical-align:middle;"></span>
            <a href="/2026/09/24/DeepSeek%20V4.1%E5%8F%91%E5%B8%83%E4%B8%8E%E8%8B%B1%E4%BC%9F%E8%BE%BE%E6%8E%A8%E5%87%BAOrin%20Nano%202%EF%BC%9A%E5%85%A8%E7%90%83AI%E5%89%8D%E6%B2%BF%E5%A4%A7%E4%BA%8B%E9%80%9F%E8%A7%88%EF%BC%882026%E5%B9%B409%E6%9C%8824%E6%97%A5%EF%BC%89/" style="color: inherit; text-decoration: none;" title="DeepSeek V4.1正式发布，在数学推理领域取得重大突破，显著提升了AI Agent的执行可靠性，其Flash版本在Artificial Analysis测速中表现顶尖。">DeepSeek V4.1发布提升Agent可靠性</a>
          </li>
          <li style="margin-bottom: 7px; border-bottom: 1px dashed rgba(128, 128, 128, 0.2); padding-bottom: 5px;">
            <span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:#06b6d4;margin-right:6px;vertical-align:middle;"></span>
            <a href="/2026/09/24/DeepSeek%20V4.1%E5%8F%91%E5%B8%83%E4%B8%8E%E8%8B%B1%E4%BC%9F%E8%BE%BE%E6%8E%A8%E5%87%BAOrin%20Nano%202%EF%BC%9A%E5%85%A8%E7%90%83AI%E5%89%8D%E6%B2%BF%E5%A4%A7%E4%BA%8B%E9%80%9F%E8%A7%88%EF%BC%882026%E5%B9%B409%E6%9C%8824%E6%97%A5%EF%BC%89/" style="color: inherit; text-decoration: none;" title="NVIDIA推出面向入门级机器人与边缘AI的Jetson Orin Nano 2，推理性能翻倍且功耗更低，旨在加速物理AI应用的规模化部署。">英伟达发布Jetson Orin Nano 2</a>
          </li>
