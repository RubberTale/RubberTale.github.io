<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>全品种 K 线复盘</title>
<meta name="description" content="RU 橡胶 / NR 20号胶 / AL 沪铝 / CU 沪铜 四品种全历史日 K 线复盘，在一个页面内切换对比">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
  :root{
    --bg:#ffffff; --fg:#1f1f1d; --muted:#8a8a84; --line:rgba(0,0,0,.10);
    --tab-bg:#f5f5f3; --tab-hover:#ecece8; --tab-active:#ffffff;
  }
  @media (prefers-color-scheme: dark){
    :root{--bg:#131316; --fg:#e9e9e6; --muted:#7d7d78; --line:rgba(255,255,255,.13);
          --tab-bg:#1e1e22; --tab-hover:#2a2a30; --tab-active:#131316;}
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--fg);
    font:13px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased}
  #tabbar{
    position:relative;z-index:10;height:48px;display:flex;align-items:center;
    background:var(--tab-bg);border-bottom:.5px solid var(--line);
    padding:0 12px;gap:4px;flex-shrink:0;
  }
  .tab{
    display:flex;align-items:center;gap:6px;
    padding:6px 16px;border-radius:8px 8px 0 0;
    text-decoration:none;color:var(--muted);font-size:13px;font-weight:500;
    cursor:pointer;transition:background .15s,color .15s;
    border:none;background:transparent;outline:none;
  }
  .tab:hover{background:var(--tab-hover)}
  .tab.active{background:var(--tab-active);color:var(--fg);
    box-shadow:0 -1px 0 0 var(--bg);position:relative}
  .tab .sym{font-weight:700}
  .tab .name{opacity:.7;font-size:12px}
  .tab-frame{
    flex:1;width:100%;height:calc(100% - 48px);border:none;
    background:var(--bg);
  }
  .tab-panel{
    display:none;width:100%;height:100%;
  }
  .tab-panel.active{display:block}
  @media (max-width:768px){
    .tab{padding:6px 10px;font-size:12px}
    .tab .name{display:none}
  }
</style>
</head>
<body>
<div id="tabbar">
  <button class="tab active" data-sym="ru" onclick="switchTab('ru')">
    <span class="sym">RU</span><span class="name">橡胶主力</span>
  </button>
  <button class="tab" data-sym="nr" onclick="switchTab('nr')">
    <span class="sym">NR</span><span class="name">20号胶主力</span>
  </button>
  <button class="tab" data-sym="al" onclick="switchTab('al')">
    <span class="sym">AL</span><span class="name">沪铝主力</span>
  </button>
  <button class="tab" data-sym="cu" onclick="switchTab('cu')">
    <span class="sym">CU</span><span class="name">沪铜主力</span>
  </button>
</div>

<div class="tab-panel active" id="panel-ru">
  <iframe class="tab-frame" src="/tools/ru-main-kline/index.html" frameborder="0" loading="lazy"></iframe>
</div>
<div class="tab-panel" id="panel-nr">
  <iframe class="tab-frame" data-src="/tools/nr-main-kline/index.html" frameborder="0" loading="lazy"></iframe>
</div>
<div class="tab-panel" id="panel-al">
  <iframe class="tab-frame" data-src="/tools/al-main-kline/index.html" frameborder="0" loading="lazy"></iframe>
</div>
<div class="tab-panel" id="panel-cu">
  <iframe class="tab-frame" data-src="/tools/cu-main-kline/index.html" frameborder="0" loading="lazy"></iframe>
</div>

<script>
function switchTab(sym) {
  document.querySelectorAll('.tab').forEach(function(t) {
    t.classList.toggle('active', t.getAttribute('data-sym') === sym);
  });
  document.querySelectorAll('.tab-panel').forEach(function(p) {
    p.classList.toggle('active', p.id === 'panel-' + sym);
  });
  // Lazy load iframe when switching to it
  var panel = document.getElementById('panel-' + sym);
  var iframe = panel.querySelector('iframe');
  if (iframe && iframe.getAttribute('data-src')) {
    iframe.src = iframe.getAttribute('data-src');
    iframe.removeAttribute('data-src');
  }
  // Resize the iframe content after switch
  setTimeout(function() {
    if (iframe && iframe.contentWindow) {
      iframe.contentWindow.dispatchEvent(new Event('resize'));
    }
  }, 100);
}
// Handle initial hash
if (location.hash) {
  var h = location.hash.slice(1);
  if (['ru','nr','al','cu'].indexOf(h) >= 0) switchTab(h);
}
</script>
</body>
</html>
