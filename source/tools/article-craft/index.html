      /* ===== 主题防闪烁引导：必须在样式与内容之前同步执行 ===== */
      (function () {
        var DARK_THEMES = ['dark', 'midnight', 'forest', 'oled'];
        var ALL = ['dark', 'light', 'sepia', 'midnight', 'forest', 'oled'];
        var t = 'dark';
        try {
          var saved = localStorage.getItem('wb-theme');
          if (saved && ALL.indexOf(saved) >= 0) t = saved;
        } catch (e) {}
        var el = document.documentElement;
        el.setAttribute('data-theme', t);
        el.classList.toggle('dark', DARK_THEMES.indexOf(t) >= 0);
      })();
    </script>

              var NAMES = ['slate','gray','zinc','neutral','stone','red','orange','amber','yellow','lime','green','emerald','teal','cyan','sky','blue','indigo','violet','purple','fuchsia','pink','rose'];
              var SHADES = [50,100,200,300,400,500,600,700,800,900,950];
              var out = {
                fixed: { white: '#ffffff', black: '#000000', ink: '#0f172a' },
              };
              NAMES.forEach(function (n) {
                var scale = {};
                SHADES.forEach(function (s) { scale[s] = 'rgb(var(--wb-' + n + '-' + s + ') / <alpha-value>)'; });
                out[n] = scale;
              });
              out.white = 'rgb(var(--wb-white) / <alpha-value>)';
              out.black = 'rgb(var(--wb-black) / <alpha-value>)';
              out.brand = out.blue;
              return out;
            })(),
          }
        }
      }
