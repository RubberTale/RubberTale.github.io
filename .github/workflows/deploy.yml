name: Hexo Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "hexo-deploy-pipeline"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 安装 Hexo 和依赖
        run: |
          npm install -g hexo-cli
          npm install

      - name: 生成静态文件 (Hexo Generate)
        run: npx hexo generate

      - name: 构建 Reverse App
        working-directory: ./reverse-app
        run: |
          npm install
          npm run build

      - name: 构建 Commodity Crisis 游戏
        working-directory: ./commodity-crisis
        run: |
          npm install
          npm run build

      - name: 将所有游戏与静态资源同步到 public 目录
        run: |
          mkdir -p public/games/reverse-app
          mkdir -p public/games/commodity-crisis
          mkdir -p public/games/kline-duel
          cp -r reverse-app/dist/* public/games/reverse-app/ || true
          cp -r commodity-crisis/dist/* public/games/commodity-crisis/ || true
          cp -r source/games/kline-duel/* public/games/kline-duel/ || true

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
